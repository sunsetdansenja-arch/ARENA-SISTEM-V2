<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BIZMONITOR - Open Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --matrix-red: #FF0000;
            --matrix-dark-bg: #0A0A0C;
            --matrix-panel-bg: rgba(15, 15, 18, 0.85);
            --matrix-hairline: rgba(255, 0, 0, 0.25);
        }
        
        body { 
            font-family: 'Space Grotesk', sans-serif; 
            background-color: var(--matrix-dark-bg);
            background-image: 
                linear-gradient(to right, rgba(255, 0, 0, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 0, 0, 0.05) 1px, transparent 1px),
                url('https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&w=1200&q=80');
            background-size: 40px 40px, 40px 40px, cover;
            background-position: center;
            background-blend-mode: overlay;
        }

        .matrix-border { border: 1px solid var(--matrix-red); }
        .matrix-hairline-border { border: 1px solid var(--matrix-hairline); }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.5); }
        ::-webkit-scrollbar-thumb { background: var(--matrix-red); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Tactical Chat Bubbles */
        .bubble { max-width: 80%; padding: 12px 16px; font-size: 14px; letter-spacing: 0.02em; }
        .bubble-admin { 
            background-color: rgba(255, 0, 0, 0.15); 
            border: 1px solid var(--matrix-red); 
            color: #FFFFFF;
            align-self: flex-end; 
        }
        .bubble-customer { 
            background-color: rgba(20, 20, 25, 0.9); 
            border: 1px solid var(--matrix-hairline); 
            color: #E2E8F0;
            align-self: flex-start; 
        }
        
        /* SLA Overdue Animation */
        .sla-breach { 
            animation: pulse-matrix-red 2s infinite; 
            background-color: rgba(255, 0, 0, 0.25) !important; 
            border-color: var(--matrix-red) !important;
        }
        @keyframes pulse-matrix-red { 
            0% { opacity: 0.9; } 50% { opacity: 0.6; } 100% { opacity: 0.9; } 
        }
        
        /* Technical Filter System */
        .filter-active { 
            background-color: var(--matrix-red) !important; 
            color: #000000 !important; 
            font-weight: 700;
        }
        .indicator-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
        }
        .indicator-active {
            background-color: var(--matrix-red);
        }
        .indicator-inactive {
            border: 1px solid var(--matrix-red);
        }
    </style>
</head>
<body class="h-[100dvh] w-full overflow-hidden flex p-2 md:p-6 gap-6 backdrop-blur-sm">

    <!-- SIDEBAR MONITOR (Selalu Terbuka/Flex) -->
    <div id="sidebar" class="w-full md:w-[440px] flex flex-col bg-[var(--matrix-panel-bg)] matrix-hairline-border backdrop-blur-xl h-full z-10 relative overflow-hidden min-h-0">
        
        <!-- HEADER -->
        <div class="border-b border-[var(--matrix-hairline)] p-4 flex justify-between items-center shrink-0 bg-black/40">
            <div>
                <h1 class="font-bold text-lg tracking-[0.15em] text-white uppercase">BUSINESS MONITOR</h1>
                <p id="connection-status" class="text-[10px] text-red-500 tracking-wider font-mono flex items-center gap-2 mt-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-red-600 animate-ping"></span> PUBLIC_ACCESS_LIVE
                </p>
            </div>
            <div class="flex gap-3 font-mono">
                <button onclick="window.history.back()" class="w-8 h-8 flex items-center justify-center bg-transparent text-white matrix-hairline-border hover:bg-red-950/30 transition-all text-xs active:scale-95">🏠</button>
                <button onclick="fetchAllData()" class="w-8 h-8 flex items-center justify-center bg-transparent text-white matrix-hairline-border hover:bg-red-950/30 transition-all text-xs active:scale-95">🔄</button>
            </div>
        </div>

        <!-- MATRIX COUNTER FILTER -->
        <div class="bg-black/20 p-4 border-b border-[var(--matrix-hairline)] flex overflow-x-auto gap-3 hide-scrollbar shrink-0">
            <div onclick="setFilter('ALL')" class="bg-transparent matrix-hairline-border flex-1 min-w-[90px] p-3 cursor-pointer hover:bg-white/5 transition-all text-left relative overflow-hidden" id="card-ALL">
                <p class="text-[9px] text-gray-500 font-mono tracking-widest uppercase">01 // ALL</p>
                <p id="sla-total" class="text-2xl font-light text-white mt-1 font-mono">0</p>
            </div>
            <div onclick="setFilter('WAITING')" class="bg-transparent matrix-hairline-border flex-1 min-w-[100px] p-3 cursor-pointer hover:bg-white/5 transition-all text-left relative overflow-hidden" id="card-WAITING">
                <p class="text-[9px] text-gray-400 font-mono tracking-widest uppercase">02 // QUEUE</p>
                <p id="sla-waiting" class="text-2xl font-light text-white mt-1 font-mono">0</p>
            </div>
            <div onclick="setFilter('BREACH')" class="bg-transparent matrix-hairline-border flex-1 min-w-[100px] p-3 cursor-pointer hover:bg-white/5 transition-all text-left relative overflow-hidden" id="card-BREACH">
                <p class="text-[9px] text-red-500 font-mono tracking-widest uppercase">03 // OVERDUE</p>
                <p id="sla-breach" class="text-2xl font-light text-red-500 mt-1 font-mono">0</p>
            </div>
        </div>

        <!-- TAB FILTERS -->
        <div class="flex text-xs font-mono tracking-widest uppercase bg-black/40 border-b border-[var(--matrix-hairline)] shrink-0">
            <div onclick="setFilter('ALL')" id="tab-all" class="flex-1 text-center py-3 cursor-pointer filter-active transition-all border-r border-[var(--matrix-hairline)]">ALL_LOGS</div>
            <div onclick="setFilter('UNREAD')" id="tab-unread" class="flex-1 text-center py-3 cursor-pointer hover:bg-white/5 text-gray-500 transition-all">UNANSWERED</div>
        </div>

        <!-- MONITOR STREAM LIST -->
        <div id="chat-list" class="flex-1 overflow-y-auto p-3 space-y-3 overscroll-contain min-h-0 bg-black/10">
            <div class="flex flex-col justify-center items-center h-full text-red-500/40 font-mono text-xs tracking-widest space-y-2">
                <div class="w-4 h-4 border-2 border-t-transparent border-red-600 rounded-full animate-spin"></div>
                <span>INITIALIZING_LINK_ACCESS...</span>
            </div>
        </div>
    </div>

    <!-- MAIN CHAT INTERFACE WINDOW (Kelas 'hidden' dihilangkan agar langsung tampil berdampingan di desktop) -->
    <div id="chat-window" class="hidden md:flex flex-1 flex-col bg-[var(--matrix-panel-bg)] matrix-hairline-border backdrop-blur-xl relative h-full overflow-hidden min-h-0 w-full">
        
        <!-- INTERFACE WINDOW HEADER -->
        <div class="bg-black/40 p-4 flex items-center border-b border-[var(--matrix-hairline)] z-10 h-[75px] shrink-0">
            <button onclick="backToList()" class="md:hidden mr-4 px-3 py-1.5 bg-transparent text-red-500 matrix-hairline-border font-mono text-xs hover:bg-red-950/30 active:scale-95 transition-all">
                &lt; BACK
            </button>
            <div class="w-9 h-9 border border border-[var(--matrix-hairline)] flex items-center justify-center text-sm mr-3 font-mono text-white bg-black/60" id="avatar-placeholder">?</div>
            <div class="flex-1 min-w-0">
                <h2 class="font-bold text-white text-md tracking-wide uppercase truncate flex items-center gap-3" id="chat-name">
                    AWAITING_STREAM
                </h2>
                <p class="text-[10px] text-gray-500 font-mono tracking-wider mt-0.5 truncate" id="chat-number">READY_FOR_DIRECT_ACCESS</p>
            </div>
        </div>

        <!-- SCREEN LOG CONTAINER -->
        <div id="message-container" class="flex-1 overflow-y-auto p-4 md:p-6 flex flex-col gap-4 overscroll-contain min-h-0 bg-black/20">
            <div class="h-full flex flex-col items-center justify-center font-mono text-xs tracking-widest text-gray-600 space-y-2">
                <div class="matrix-hairline-border px-4 py-3 bg-black/60 text-center uppercase max-w-xs text-red-500/80">
                    [LINK_AUTHENTICATED]<br>MENUNGGU DATA STREAM DILAYANI...
                </div>
            </div>
        </div>
    </div>

    <script>
        const WA_WEBHOOK = "https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/get-chat-logs";
        const BIZ_WEBHOOK = "https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/86cee1b8-b00d-4aa6-8ff4-23735dc9afe1";
        
        let allLogs = []; 
        let activeBizData = {}; 
        let groupedGroupsArray = []; 
        let currentActiveWa = null;
        let currentFilter = 'ALL'; 

        async function fetchAllData() {
            try {
                const [waRes, bizRes] = await Promise.all([
                    fetch(WA_WEBHOOK, { mode: 'cors' }),
                    fetch(BIZ_WEBHOOK, {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({action: 'get_dashboard', role: 'admin', branch: 'ALL'})
                    })
                ]);

                if (bizRes.ok) {
                    const bData = await bizRes.json();
                    activeBizData = {};
                    bData.forEach(item => {
                        let d = item.json || item;
                        let stat = String(d.status_bisnis || d.status_unit || '').toLowerCase();
                        let waRaw = String(d.nomor_pelanggan || d.nomor_wa || '').replace(/\D/g, '').replace(/^0/, '62');
                        if(waRaw && stat) activeBizData[waRaw] = stat;
                    });
                }

                if (waRes.ok) {
                    const data = await waRes.json();
                    allLogs = data;
                    processGroups(data);
                    
                    const statusEl = document.getElementById('connection-status');
                    statusEl.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-red-600 animate-pulse"></span> PUBLIC_STREAM_LIVE // ${new Date().toLocaleTimeString('id-ID').substring(0,5)}`;
                    statusEl.className = "text-[10px] text-red-500 tracking-wider font-mono flex items-center gap-2 mt-1";
                } else {
                    throw new Error("HTTP Error");
                }
            } catch (e) { 
                const statusEl = document.getElementById('connection-status');
                statusEl.innerHTML = `⚠️ STREAM_DISCONNECTED`;
                statusEl.className = "text-[10px] text-red-600 tracking-wider font-mono flex items-center gap-2 mt-1 font-bold";
            }
        }

        function processGroups(logs) {
            let tempGroups = {};
            
            logs.forEach(l => {
                if(!tempGroups[l.nomor_wa]) {
                    tempGroups[l.nomor_wa] = { messages: [], name: l.nomor_wa, wa: l.nomor_wa };
                }
                if (l.nama && l.nama !== 'Admin' && l.nama !== '?') {
                    tempGroups[l.nomor_wa].name = l.nama;
                }
                tempGroups[l.nomor_wa].messages.push(l);
            });

            groupedGroupsArray = Object.values(tempGroups).map(group => {
                const lastMsg = group.messages[0]; 
                const lastMsgDate = new Date(lastMsg.waktu.replace(' ', 'T'));
                const diffMins = (new Date() - lastMsgDate) / 60000;
                
                group.bizStatus = activeBizData[group.wa] || null;
                group.isWaiting = lastMsg.tipe === 'Masuk';
                group.isBreach = group.isWaiting && diffMins > 8;
                group.diffMins = diffMins;
                group.lastMsgDate = lastMsgDate;
                group.lastMsg = lastMsg;
                return group;
            });

            renderSidebar();
            
            // Otomatis buka chat pertama jika link baru dibuka dan belum ada chat aktif yang dipilih
            if (!currentActiveWa && groupedGroupsArray.length > 0) {
                openChat(groupedGroupsArray[0].wa, true);
            } else if (currentActiveWa) {
                openChat(currentActiveWa, true);
            }
        }

        function setFilter(filterType) {
            currentFilter = filterType;
            
            if (filterType === 'UNREAD') {
                document.getElementById('tab-unread').classList.add('filter-active');
                document.getElementById('tab-all').classList.add('text-gray-500');
                document.getElementById('tab-all').classList.remove('filter-active');
            } else {
                document.getElementById('tab-all').classList.add('filter-active');
                document.getElementById('tab-unread').classList.remove('filter-active');
                document.getElementById('tab-unread').classList.add('text-gray-500');
            }

            ['ALL', 'WAITING', 'BREACH'].forEach(id => {
                const card = document.getElementById(`card-${id}`);
                if (card) {
                    if (filterType === id) { 
                        card.style.borderColor = '#FF0000';
                        card.style.backgroundColor = 'rgba(255, 0, 0, 0.05)';
                    } else { 
                        card.style.borderColor = 'rgba(255, 0, 0, 0.25)';
                        card.style.backgroundColor = 'transparent';
                    }
                }
            });

            renderSidebar();
        }

        function renderSidebar() {
            let slaWaiting = 0, slaBreach = 0;

            groupedGroupsArray.forEach(g => {
                if (g.isWaiting) slaWaiting++;
                if (g.isBreach) slaBreach++;
            });

            let filteredArray = groupedGroupsArray.filter(g => {
                if (currentFilter === 'WAITING') return g.isWaiting;
                if (currentFilter === 'BREACH') return g.isBreach;
                if (currentFilter === 'UNREAD') return g.isWaiting;
                return true; 
            });

            filteredArray.sort((a, b) => {
                if (a.isWaiting && !b.isWaiting) return -1;
                if (!a.isWaiting && b.isWaiting) return 1;
                return b.lastMsgDate.getTime() - a.lastMsgDate.getTime();
            });

            const listContainer = document.getElementById('chat-list');
            listContainer.innerHTML = '';
            
            if (filteredArray.length === 0) {
                listContainer.innerHTML = `<div class="text-center p-6 font-mono text-xs text-gray-600 mt-10 tracking-widest">[NO_STREAMS_MATCH_FILTER]</div>`;
            }

            filteredArray.forEach(group => {
                let cardClass = "p-4 matrix-hairline-border cursor-pointer transition-all hover:bg-white/[0.02] active:scale-[0.99] duration-150 ";
                let badgeHtml = "";
                let indicatorClass = "indicator-inactive";

                if (group.isBreach) {
                    cardClass += "sla-breach";
                    badgeHtml = `<span class="bg-red-900/60 border border-red-600 text-red-200 text-[9px] px-2 py-0.5 font-mono uppercase tracking-wider">OVERDUE ${Math.floor(group.diffMins)}m</span>`;
                    indicatorClass = "indicator-active";
                } else if (group.isWaiting) {
                    cardClass += "bg-red-950/10";
                    badgeHtml = `<span class="bg-black/80 border border-red-900 text-gray-300 text-[9px] px-2 py-0.5 font-mono uppercase tracking-wider">QUEUE ${Math.floor(group.diffMins)}m</span>`;
                    indicatorClass = "indicator-active";
                } else {
                    cardClass += "bg-transparent opacity-60";
                    badgeHtml = `<span class="text-gray-500 font-mono text-[9px] tracking-widest">RESOLVED</span>`;
                }

                if (currentActiveWa === group.wa) cardClass += " !border-[#FF0000] bg-white/[0.03]";

                const jam = group.lastMsgDate.toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});
                const snippet = group.lastMsg.tipe === 'Keluar' ? `Sys_Admin: ${group.lastMsg.pesan}` : group.lastMsg.pesan;

                listContainer.innerHTML += `
                    <div onclick="openChat('${group.wa}')" class="${cardClass}">
                        <div class="flex justify-between items-start mb-2">
                            <div class="font-bold text-white text-sm flex items-center gap-3 pr-2 truncate">
                                <span class="indicator-dot ${indicatorClass} shrink-0"></span>
                                <span class="truncate tracking-wide">${group.name}</span> 
                            </div>
                            <div class="text-[10px] text-gray-400 font-mono bg-black/40 px-1.5 py-0.5 border border-white/5">${jam}</div>
                        </div>
                        <div class="flex justify-between items-center mt-3 gap-4">
                            <div class="text-xs text-gray-400 font-light truncate max-w-[65%] font-mono">${snippet}</div>
                            <div class="shrink-0">${badgeHtml}</div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('sla-total').innerText = groupedGroupsArray.length;
            document.getElementById('sla-waiting').innerText = slaWaiting;
            document.getElementById('sla-breach').innerText = slaBreach;
        }

        function openChat(wa, isAutoUpdate = false) {
            currentActiveWa = wa;
            const group = groupedGroupsArray.find(g => g.wa === wa);
            if (!group) return;

            document.getElementById('chat-name').innerHTML = `${group.name}`;
            document.getElementById('chat-number').innerText = wa.includes('@') ? "SESSION_NODE // PUBLIC_VIEW" : "DATALINK // +" + wa;
            document.getElementById('avatar-placeholder').innerText = group.name.charAt(0).toUpperCase();
            
            const container = document.getElementById('message-container');
            container.innerHTML = '';
            
            const sortedMessages = [...group.messages].sort((a,b) => new Date(a.waktu.replace(' ','T')) - new Date(b.waktu.replace(' ','T')));
            
            let lastDateStr = "";
            let earliestUnansweredTime = null; 

            sortedMessages.forEach(msg => {
                const msgDate = new Date(msg.waktu.replace(' ', 'T'));
                const dateStr = msgDate.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' });
                const timeStr = msgDate.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                const msgTimeMs = msgDate.getTime();

                if (dateStr !== lastDateStr) {
                    container.innerHTML += `
                        <div class="flex justify-center my-4">
                            <div class="bg-black/80 border border-[var(--matrix-hairline)] text-gray-400 font-mono px-3 py-1 text-[9px] tracking-widest uppercase">
                                ${dateStr}
                            </div>
                        </div>
                    `;
                    lastDateStr = dateStr;
                }

                const isAdmin = msg.tipe === 'Keluar';
                let delayStamp = "";

                if (!isAdmin) {
                    if (!earliestUnansweredTime) earliestUnansweredTime = msgTimeMs;
                } else if (isAdmin && earliestUnansweredTime) {
                    const diffSec = (msgTimeMs - earliestUnansweredTime) / 1000;
                    if (diffSec > 0) {
                        const mins = Math.floor(diffSec / 60);
                        const secs = Math.floor(diffSec % 60);
                        let colorClass = mins > 8 ? 'text-red-500 border-red-600' : 'text-gray-400 border-gray-600';
                        delayStamp = `<span class="ml-2 inline-block border bg-black/40 px-1.5 py-0.5 text-[9px] font-mono tracking-wider ${colorClass}">⏱️ ${mins}m ${secs}s</span>`;
                    }
                    earliestUnansweredTime = null; 
                }
                
                const checkmark = isAdmin ? `<span class="text-red-500 font-mono ml-1.5 font-bold">// COMPLETED</span>` : '';

                container.innerHTML += `
                    <div class="flex ${isAdmin ? 'justify-end' : 'justify-start'} animate-fade-in">
                        <div class="bubble ${isAdmin ? 'bubble-admin' : 'bubble-customer'} flex flex-col">
                            <div class="font-normal break-words leading-relaxed">${msg.pesan}</div>
                            <div class="flex justify-between items-end gap-4 mt-2 border-t border-white/5 pt-1">
                                <div>${delayStamp}</div>
                                <div class="text-[9px] text-gray-500 font-mono tracking-wider whitespace-nowrap">
                                    ${timeStr} ${checkmark}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            if (window.innerWidth < 768 && !isAutoUpdate) {
                document.getElementById('sidebar').classList.add('hidden');
                document.getElementById('sidebar').classList.remove('flex');
                
                document.getElementById('chat-window').classList.remove('hidden');
                document.getElementById('chat-window').classList.add('flex');
            }
            container.scrollTop = container.scrollHeight;
        }

        function backToList() {
            currentActiveWa = null;
            
            document.getElementById('sidebar').classList.remove('hidden');
            document.getElementById('sidebar').classList.add('flex');
            
            document.getElementById('chat-window').classList.add('hidden');
            document.getElementById('chat-window').classList.remove('flex');
            
            renderSidebar();
        }

        fetchAllData();
        setFilter('ALL'); 
        setInterval(fetchAllData, 30000);
    </script>
</body>
</html>
