<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARENA - Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --mario-orange: #FF6B00;
            --mario-yellow: #FFD700;
            --mario-bg: #f3f4f6;
        }
        body { font-family: 'Fredoka', sans-serif; background-color: var(--mario-bg); }
        
        /* Mario Elements */
        .mario-border { border: 3px solid black; }
        .mario-shadow { box-shadow: 4px 4px 0px 0px black; }
        .mario-shadow-sm { box-shadow: 2px 2px 0px 0px black; }
        
        .chat-bg { background-color: #ffe8d6; background-image: radial-gradient(#FF6B00 1px, transparent 1px); background-size: 20px 20px; opacity: 0.9; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.5); border-radius: 10px; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Chat Bubbles */
        .bubble { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14px; position: relative; }
        .bubble-admin { background-color: var(--mario-yellow); align-self: flex-end; border-bottom-right-radius: 0; }
        .bubble-customer { background-color: white; align-self: flex-start; border-bottom-left-radius: 0; }
        
        /* SLA Animations */
        .sla-breach { animation: pulse-red 1.5s infinite; background-color: #ffcccc !important; }
        @keyframes pulse-red { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
        
        /* Filter Active State */
        .filter-active { background-color: var(--mario-orange) !important; color: white !important; border-color: black !important; }
        .card-active { border-color: #FF6B00 !important; background-color: #fff7ed !important; }
    </style>
</head>
<body class="h-[100dvh] w-full overflow-hidden flex bg-gray-200 p-2 md:p-4 gap-4">

    <div id="sidebar" class="w-full md:w-[420px] flex flex-col bg-white mario-border mario-shadow rounded-2xl h-full z-10 relative overflow-hidden min-h-0">
        
        <div class="bg-black text-white p-4 flex justify-between items-center shrink-0">
            <div>
                <h1 class="font-black text-xl tracking-wider text-[#FFD700]">ARENA MIRROR</h1>
                <p id="connection-status" class="text-xs text-green-400 font-bold flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Terhubung
                </p>
            </div>
            <div class="flex gap-2">
                <button onclick="window.history.back()" class="p-2 bg-[#FFD700] text-black rounded-lg hover:bg-yellow-300 text-xs font-black mario-border transition-transform active:translate-y-1">🏠</button>
                <button onclick="fetchAllData()" class="p-2 bg-white text-black rounded-lg hover:bg-gray-200 text-xs font-black mario-border transition-transform active:translate-y-1">🔄</button>
            </div>
        </div>

        <div class="bg-gray-100 p-3 border-b-3 border-black flex overflow-x-auto gap-2 hide-scrollbar mario-border border-x-0 border-t-0 shrink-0">
            <div onclick="setFilter('ALL')" class="bg-white mario-border rounded-xl p-2 cursor-pointer hover:bg-gray-50 flex-shrink-0 min-w-[70px] text-center" id="card-ALL">
                <p class="text-[9px] text-gray-500 font-black uppercase">Semua</p>
                <p id="sla-total" class="text-lg font-black text-black">0</p>
            </div>
            <div onclick="setFilter('WAITING')" class="bg-[#FFD700] mario-border rounded-xl p-2 cursor-pointer hover:bg-yellow-300 flex-shrink-0 min-w-[80px] text-center" id="card-WAITING">
                <p class="text-[9px] text-black font-black uppercase">Menunggu</p>
                <p id="sla-waiting" class="text-lg font-black text-black">0</p>
            </div>
            <div onclick="setFilter('BREACH')" class="bg-[#FF6B00] mario-border rounded-xl p-2 cursor-pointer hover:bg-orange-500 flex-shrink-0 min-w-[75px] text-center" id="card-BREACH">
                <p class="text-[9px] text-white font-black uppercase">> 8 Menit</p>
                <p id="sla-breach" class="text-lg font-black text-white">0</p>
            </div>
            <div onclick="setFilter('PLAYING')" class="bg-red-500 mario-border rounded-xl p-2 cursor-pointer hover:bg-red-400 flex-shrink-0 min-w-[75px] text-center" id="card-PLAYING">
                <p class="text-[9px] text-white font-black uppercase">Playing</p>
                <p id="sla-playing" class="text-lg font-black text-white">0</p>
            </div>
            <div onclick="setFilter('BOOKED')" class="bg-orange-400 mario-border rounded-xl p-2 cursor-pointer hover:bg-orange-300 flex-shrink-0 min-w-[75px] text-center" id="card-BOOKED">
                <p class="text-[9px] text-white font-black uppercase">Booked</p>
                <p id="sla-booked" class="text-lg font-black text-white">0</p>
            </div>
        </div>

        <div class="flex text-sm font-black bg-white mario-border border-x-0 border-t-0 shrink-0">
            <div onclick="setFilter('ALL')" id="tab-all" class="flex-1 text-center py-2.5 cursor-pointer filter-active border-r-3 border-black">Semua Chat</div>
            <div onclick="setFilter('UNREAD')" id="tab-unread" class="flex-1 text-center py-2.5 cursor-pointer hover:bg-gray-100 text-gray-400">Perlu Dibalas</div>
        </div>

        <div id="chat-list" class="flex-1 overflow-y-auto bg-white p-2 space-y-2 overscroll-contain min-h-0">
            <div class="flex justify-center items-center h-full text-gray-400 font-black animate-pulse">
                Menarik data...
            </div>
        </div>
    </div>

    <div id="chat-window" class="hidden md:flex flex-1 flex-col bg-white mario-border mario-shadow rounded-2xl relative h-full overflow-hidden min-h-0 w-full">
        
        <div class="bg-black text-white p-3 md:p-4 flex items-center border-b-3 border-black z-10 h-[75px] shrink-0">
            <button onclick="backToList()" class="md:hidden mr-4 p-2 bg-white text-black rounded-lg mario-border font-black text-xs active:translate-y-1">
                ◀ KEMBALI
            </button>
            <div class="w-10 h-10 rounded-full bg-[#FFD700] mario-border flex items-center justify-center text-xl mr-3 font-black text-black" id="avatar-placeholder">?</div>
            <div class="flex-1">
                <h2 class="font-black text-[#FFD700] text-lg leading-tight uppercase tracking-wide flex items-center gap-2" id="chat-name">
                    Pilih Chat
                </h2>
                <p class="text-xs text-gray-300 font-semibold" id="chat-number">Pilih dari sidebar</p>
            </div>
        </div>

        <div id="message-container" class="flex-1 overflow-y-auto p-4 md:p-6 flex flex-col gap-3 chat-bg overscroll-contain min-h-0">
            <div class="h-full flex items-center justify-center">
                <div class="bg-white mario-border mario-shadow-sm px-4 py-2 rounded-xl text-sm font-black text-black">
                    Let's A Go! Monitor Arena.
                </div>
            </div>
        </div>
    </div>

    <script>
        const WA_WEBHOOK = "https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/get-chat-logs";
        const ARENA_WEBHOOK = "https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/86cee1b8-b00d-4aa6-8ff4-23735dc9afe1";
        
        let allLogs = []; 
        let activeArenaData = {}; 
        let groupedGroupsArray = []; 
        let currentActiveWa = null;
        let currentFilter = 'ALL'; 

        async function fetchAllData() {
            try {
                const [waRes, arenaRes] = await Promise.all([
                    fetch(WA_WEBHOOK, { mode: 'cors' }),
                    fetch(ARENA_WEBHOOK, {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({action: 'get_dashboard', role: 'admin', branch: 'ALL'})
                    })
                ]);

                if (arenaRes.ok) {
                    const aData = await arenaRes.json();
                    activeArenaData = {};
                    aData.forEach(item => {
                        let d = item.json || item;
                        let stat = String(d.status_unit_arena).toLowerCase();
                        if (stat === 'booked' || stat === 'playing' || stat === 'main' || stat === 'book') {
                            let normStat = (stat === 'main') ? 'playing' : (stat === 'book' ? 'booked' : stat);
                            let waRaw = String(d.nomor_pelanggan_arena || '').replace(/\D/g, '').replace(/^0/, '62');
                            if(waRaw) activeArenaData[waRaw] = normStat;
                        }
                    });
                }

                if (waRes.ok) {
                    const data = await waRes.json();
                    allLogs = data;
                    processGroups(data);
                    
                    const statusEl = document.getElementById('connection-status');
                    statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Terhubung (${new Date().toLocaleTimeString('id-ID').substring(0,5)})`;
                    statusEl.className = "text-xs text-green-400 font-bold flex items-center gap-1";
                } else {
                    throw new Error("HTTP Error");
                }
            } catch (e) { 
                const statusEl = document.getElementById('connection-status');
                statusEl.innerHTML = `⚠️ Terputus`;
                statusEl.className = "text-xs text-red-500 font-bold flex items-center gap-1";
            }
        }

        function processGroups(logs) {
            let tempGroups = {};
            
            logs.forEach(l => {
                if(!tempGroups[l.nomor_wa]) {
                    tempGroups[l.nomor_wa] = { messages: [], name: l.nomor_wa, wa: l.nomor_wa };
                }
                if (l.nama && l.nama !== 'Admin Arena' && l.nama !== '?') {
                    tempGroups[l.nomor_wa].name = l.nama;
                }
                tempGroups[l.nomor_wa].messages.push(l);
            });

            groupedGroupsArray = Object.values(tempGroups).map(group => {
                const lastMsg = group.messages[0]; 
                const lastMsgDate = new Date(lastMsg.waktu.replace(' ', 'T'));
                const diffMins = (new Date() - lastMsgDate) / 60000;
                
                group.arenaStatus = activeArenaData[group.wa] || null;
                group.isWaiting = lastMsg.tipe === 'Masuk';
                group.isBreach = group.isWaiting && diffMins > 8;
                group.diffMins = diffMins;
                group.lastMsgDate = lastMsgDate;
                group.lastMsg = lastMsg;
                return group;
            });

            renderSidebar();
            if(currentActiveWa) openChat(currentActiveWa, true);
        }

        function setFilter(filterType) {
            currentFilter = filterType;
            
            if (filterType === 'UNREAD') {
                document.getElementById('tab-unread').classList.add('filter-active');
                document.getElementById('tab-all').classList.add('text-gray-400');
                document.getElementById('tab-all').classList.remove('filter-active');
            } else {
                document.getElementById('tab-all').classList.add('filter-active');
                document.getElementById('tab-unread').classList.remove('filter-active');
                document.getElementById('tab-unread').classList.add('text-gray-400');
            }

            ['ALL', 'WAITING', 'BREACH', 'PLAYING', 'BOOKED'].forEach(id => {
                const card = document.getElementById(`card-${id}`);
                if (card) {
                    if (filterType === id) { card.classList.add('border-black', 'border-4', 'opacity-100'); card.classList.remove('opacity-60'); }
                    else { card.classList.remove('border-black', 'border-4', 'opacity-100'); card.classList.add('opacity-60'); }
                }
            });

            renderSidebar();
        }

        function renderSidebar() {
            let slaWaiting = 0, slaBreach = 0, countPlaying = 0, countBooked = 0;

            groupedGroupsArray.forEach(g => {
                if (g.isWaiting) slaWaiting++;
                if (g.isBreach) slaBreach++;
                if (g.arenaStatus === 'playing') countPlaying++;
                if (g.arenaStatus === 'booked') countBooked++;
            });

            let filteredArray = groupedGroupsArray.filter(g => {
                if (currentFilter === 'WAITING') return g.isWaiting;
                if (currentFilter === 'BREACH') return g.isBreach;
                if (currentFilter === 'UNREAD') return g.isWaiting;
                if (currentFilter === 'PLAYING') return g.arenaStatus === 'playing';
                if (currentFilter === 'BOOKED') return g.arenaStatus === 'booked';
                return true; 
            });

            filteredArray.sort((a, b) => {
                if (a.isWaiting && !b.isWaiting) return -1;
                if (!a.isWaiting && b.isWaiting) return 1;
                return b.lastMsgDate.getTime() - a.lastMsgDate.getTime();
            });

            const listContainer = document.getElementById('chat-list');
            listContainer.innerHTML = '';
            
            if (filteredArray.length === 0) {
                listContainer.innerHTML = `<div class="text-center p-6 font-black text-gray-400 mt-10">TIDAK ADA CHAT SESUAI FILTER</div>`;
            }

            filteredArray.forEach(group => {
                let cardClass = "p-3 rounded-xl mario-border cursor-pointer transition-transform active:translate-y-1 mb-2 ";
                let badgeHtml = "";
                let arenaBadgeHtml = "";

                if (group.isBreach) {
                    cardClass += "sla-breach mario-shadow-sm";
                    badgeHtml = `<span class="bg-red-600 text-white text-[10px] px-2 py-1 rounded-md font-black uppercase mario-border">Overdue ${Math.floor(group.diffMins)}m</span>`;
                } else if (group.isWaiting) {
                    cardClass += "bg-[#FFD700] mario-shadow-sm";
                    badgeHtml = `<span class="bg-black text-white text-[10px] px-2 py-1 rounded-md font-black uppercase">Tunggu ${Math.floor(group.diffMins)}m</span>`;
                } else {
                    cardClass += "bg-white border-gray-300 opacity-80 hover:bg-gray-50 border-2";
                    badgeHtml = `<span class="text-black font-black text-[10px]">✓ CLEAR</span>`;
                }

                if (group.arenaStatus === 'playing') arenaBadgeHtml = `<span class="bg-red-500 text-white text-[8px] px-1.5 py-0.5 rounded font-black border border-red-700 shadow-sm ml-2">🔴 PLAYING</span>`;
                if (group.arenaStatus === 'booked') arenaBadgeHtml = `<span class="bg-[#FF6B00] text-white text-[8px] px-1.5 py-0.5 rounded font-black border border-orange-800 shadow-sm ml-2">⏳ BOOKED</span>`;

                if (currentActiveWa === group.wa) cardClass += " border-4 border-[#FF6B00]";

                const jam = group.lastMsgDate.toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});
                const snippet = group.lastMsg.tipe === 'Keluar' ? `Admin: ${group.lastMsg.pesan}` : group.lastMsg.pesan;

                listContainer.innerHTML += `
                    <div onclick="openChat('${group.wa}')" class="${cardClass}">
                        <div class="flex justify-between items-start mb-1">
                            <div class="font-black text-black text-sm flex items-center pr-2 truncate">
                                <span class="truncate">${group.name}</span> 
                                ${arenaBadgeHtml}
                            </div>
                            <div class="text-[10px] text-black font-bold whitespace-nowrap bg-white px-1 rounded border border-black">${jam}</div>
                        </div>
                        <div class="flex justify-between items-center mt-2">
                            <div class="text-xs text-gray-700 font-semibold truncate max-w-[60%]">${snippet}</div>
                            <div>${badgeHtml}</div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('sla-total').innerText = groupedGroupsArray.length;
            document.getElementById('sla-waiting').innerText = slaWaiting;
            document.getElementById('sla-breach').innerText = slaBreach;
            document.getElementById('sla-playing').innerText = countPlaying;
            document.getElementById('sla-booked').innerText = countBooked;
        }

        function openChat(wa, isAutoUpdate = false) {
            currentActiveWa = wa;
            const group = groupedGroupsArray.find(g => g.wa === wa);
            if (!group) return;

            let arenaBadgeHtml = "";
            if (group.arenaStatus === 'playing') arenaBadgeHtml = `<span class="bg-red-500 text-white text-[10px] px-2 py-1 rounded font-black border border-red-700">🔴 PLAYING</span>`;
            if (group.arenaStatus === 'booked') arenaBadgeHtml = `<span class="bg-[#FF6B00] text-white text-[10px] px-2 py-1 rounded font-black border border-orange-800">⏳ BOOKED</span>`;

            document.getElementById('chat-name').innerHTML = `${group.name} ${arenaBadgeHtml}`;
            document.getElementById('chat-number').innerText = wa.includes('@') ? "WhatsApp Number" : "+" + wa;
            document.getElementById('avatar-placeholder').innerText = group.name.charAt(0).toUpperCase();
            
            const container = document.getElementById('message-container');
            container.innerHTML = '';
            
            const sortedMessages = [...group.messages].sort((a,b) => new Date(a.waktu.replace(' ','T')) - new Date(b.waktu.replace(' ','T')));
            
            let lastDateStr = "";
            let earliestUnansweredTime = null; 

            sortedMessages.forEach(msg => {
                const msgDate = new Date(msg.waktu.replace(' ', 'T'));
                const dateStr = msgDate.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' });
                const timeStr = msgDate.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                const msgTimeMs = msgDate.getTime();

                if (dateStr !== lastDateStr) {
                    container.innerHTML += `
                        <div class="flex justify-center my-3">
                            <div class="bg-black text-[#FFD700] mario-border px-3 py-1 rounded-xl text-[10px] font-black uppercase">
                                ${dateStr}
                            </div>
                        </div>
                    `;
                    lastDateStr = dateStr;
                }

                const isAdmin = msg.tipe === 'Keluar';
                let delayStamp = "";

                if (!isAdmin) {
                    if (!earliestUnansweredTime) earliestUnansweredTime = msgTimeMs;
                } else if (isAdmin && earliestUnansweredTime) {
                    const diffSec = (msgTimeMs - earliestUnansweredTime) / 1000;
                    if (diffSec > 0) {
                        const mins = Math.floor(diffSec / 60);
                        const secs = Math.floor(diffSec % 60);
                        let colorClass = mins > 8 ? 'bg-red-600' : 'bg-black';
                        delayStamp = `<span class="ml-2 mt-1 inline-block ${colorClass} text-white px-2 py-0.5 rounded-md text-[9px] font-black mario-border">⏱️ ${mins}m ${secs}s</span>`;
                    }
                    earliestUnansweredTime = null; 
                }
                
                const checkmark = isAdmin ? `<span class="text-black ml-1">✓✓</span>` : '';

                container.innerHTML += `
                    <div class="flex ${isAdmin ? 'justify-end' : 'justify-start'}">
                        <div class="bubble ${isAdmin ? 'bubble-admin' : 'bubble-customer'} mario-border mario-shadow-sm flex flex-col">
                            <div class="text-black font-semibold break-words">${msg.pesan}</div>
                            <div class="flex justify-between items-end gap-3 mt-1">
                                <div>${delayStamp}</div>
                                <div class="text-[10px] text-black opacity-60 font-black whitespace-nowrap">
                                    ${timeStr} ${checkmark}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            // PERBAIKAN BUG HP: Sidebar di-hidden dan Chat Window diubah menjadi flex
            if (window.innerWidth < 768 && !isAutoUpdate) {
                document.getElementById('sidebar').classList.add('hidden');
                document.getElementById('sidebar').classList.remove('flex');
                
                document.getElementById('chat-window').classList.remove('hidden');
                document.getElementById('chat-window').classList.add('flex');
            }
            container.scrollTop = container.scrollHeight;
        }

        function backToList() {
            currentActiveWa = null;
            
            // PERBAIKAN BUG HP: Kembalikan class flex pada sidebar dan sembunyikan Chat Window
            document.getElementById('sidebar').classList.remove('hidden');
            document.getElementById('sidebar').classList.add('flex');
            
            document.getElementById('chat-window').classList.add('hidden');
            document.getElementById('chat-window').classList.remove('flex');
            
            renderSidebar();
        }

        fetchAllData();
        setFilter('ALL'); 
        setInterval(fetchAllData, 30000);
    </script>
</body>
</html>
