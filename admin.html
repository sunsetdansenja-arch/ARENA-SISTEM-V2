<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARENA SYSTEM - Admin Kasir</title>
    
    <link rel="icon" href="https://raw.githubusercontent.com/sunsetdansenja-arch/bot-arrena-assets/main/logo%20arena%20gaming.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --mario-orange: #FF6B00; --mario-black: #000000; --mario-yellow: #FFD700; }
        body { font-family: 'Fredoka', sans-serif; background-color: var(--mario-orange); color: var(--mario-black); -webkit-font-smoothing: antialiased; background-image: radial-gradient(rgba(0,0,0,0.05) 2px, transparent 2px); background-size: 20px 20px; }
        .mario-card { background-color: white; border: 4px solid var(--mario-black); border-radius: 16px; box-shadow: 6px 6px 0px 0px var(--mario-black); }
        .mario-btn { background-color: white; border: 4px solid var(--mario-black); border-radius: 12px; box-shadow: 4px 4px 0px 0px var(--mario-black); transition: all 0.1s ease-in-out; font-weight: 700; text-align: center; cursor: pointer; text-decoration: none; }
        .mario-btn:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px 0px var(--mario-black); }
        .mario-input { width: 100%; background-color: #F3F4F6; border: 3px solid var(--mario-black); border-radius: 8px; padding: 10px; font-weight: 600; outline: none; }
        .mario-input:focus { border-color: var(--mario-orange); background-color: white; }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 448px; background: white; border-top: 4px solid var(--mario-black); display: flex; justify-content: space-around; padding: 10px 0; z-index: 50; }
        .nav-item { flex: 1; text-align: center; font-size: 10px; font-weight: bold; color: gray; cursor: pointer; }
        .nav-item.active { color: var(--mario-orange); text-shadow: 1px 1px 0px black; }
        .nav-icon { font-size: 20px; display: block; margin-bottom: 2px; }
        #loader { position: fixed; inset: 0; background: rgba(255,107,0,0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .spinner { width: 50px; height: 50px; border: 6px solid var(--mario-black); border-top-color: var(--mario-yellow); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }
        .animate-pop { animation: popIn 0.3s forwards; }
        @keyframes popIn { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 8px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 999; display: flex; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(4px); }
        .font-beuna { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="pb-24">

    <script>
        const session = JSON.parse(localStorage.getItem('arena_session_v6'));
        if (!session || session.role !== 'admin') { 
            window.location.href = 'index.html'; 
        }
    </script>

    <div id="loader">
        <div class="spinner mb-4"></div>
        <h2 id="loader-text" class="text-xl font-black text-white">SINKRONISASI...</h2>
    </div>

    <header class="max-w-md mx-auto flex justify-between items-center bg-black p-4 sticky top-0 z-40 border-b-4 border-yellow-400">
        <div>
            <h1 class="text-lg font-black text-white">ARENA SYSTEM</h1>
            <p id="user-info-text" class="text-[10px] font-bold text-yellow-400">Admin Kasir</p>
        </div>
        <div class="flex gap-2">
            <button onclick="APP.loadDashboard()" class="bg-blue-500 text-white p-2 rounded-lg border-2 border-white">🔄</button>
            <button onclick="APP.logout()" class="bg-red-500 text-white p-2 rounded-lg border-2 border-white">🚪</button>
        </div>
    </header>

    <main id="app" class="max-w-md mx-auto p-4 mt-2 animate-pop">
        <section id="view-main">
            <div id="main-content" class="pb-10 space-y-4"></div>
        </section>
    </main>

    <div id="modal-acc" class="modal-overlay hidden">
        <div class="mario-card p-6 w-full max-w-sm animate-pop text-center">
            <h2 class="text-xl font-black mb-4 border-b-2 border-black pb-2 text-green-600 uppercase">Pilih Unit ✅</h2>
            <div class="space-y-3 text-left">
                <label class="text-xs font-bold block">Alokasikan pesanan ini ke:</label>
                <select id="acc-modal-unit" class="mario-input p-2 text-sm font-black"></select>
                <div class="flex gap-2 mt-4">
                    <button onclick="APP.closeModal('modal-acc')" class="mario-btn bg-gray-200 text-gray-700 p-3 flex-1 text-sm border-gray-400">Batal</button>
                    <button onclick="APP.confirmAccBooking()" class="mario-btn bg-green-500 text-white p-3 flex-1 text-sm border-green-700">GAS ACC 🚀</button>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-cancel" class="modal-overlay hidden">
        <div class="mario-card p-6 w-full max-w-sm animate-pop">
            <h2 class="text-xl font-black mb-4 text-center border-b-2 border-black pb-2 text-red-600 uppercase">Batalkan Pesanan ❌</h2>
            <div class="space-y-3">
                <label class="text-xs font-bold block">Pilih Alasan Batal:</label>
                <select id="cancel-reason" class="mario-input p-2 text-sm" onchange="APP.toggleCancelOther()">
                    <option value="Telat Respon">Telat Respon (Customer Hilang)</option>
                    <option value="Unit Full">Unit Full / Habis</option>
                    <option value="Request Customer">Permintaan Customer (Ganti Jadwal dll)</option>
                    <option value="Lainnya">Lainnya (Ketik Manual)</option>
                </select>
                <input type="text" id="cancel-other" class="mario-input p-2 text-sm hidden" placeholder="Ketik alasan spesifik...">
                <div class="flex gap-2 mt-4">
                    <button onclick="APP.closeModal('modal-cancel')" class="mario-btn bg-gray-200 text-gray-700 p-3 flex-1 text-sm border-gray-400">Kembali</button>
                    <button onclick="APP.confirmCancel()" class="mario-btn bg-red-600 text-white p-3 flex-1 text-sm border-red-800">Batalkan</button>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-payment" class="modal-overlay hidden">
        <div class="mario-card p-6 w-full max-w-sm animate-pop text-center">
            <h2 class="text-xl font-black mb-4 border-b-2 border-black pb-2 text-green-600 uppercase">Pembayaran 💰</h2>
            <p class="text-xs font-bold text-gray-600 mb-4">Pilih metode lunas customer:</p>
            <div class="grid grid-cols-2 gap-3 mb-4">
                <button onclick="APP.confirmPayment('Cash')" class="mario-btn bg-green-400 text-black p-4 text-sm border-green-700 hover:bg-green-500">💵 CASH</button>
                <button onclick="APP.confirmPayment('Transfer')" class="mario-btn bg-blue-500 text-white p-4 text-sm border-blue-800 hover:bg-blue-600">📱 TRANSFER</button>
            </div>
            <button onclick="APP.closeModal('modal-payment')" class="w-full text-xs font-bold text-gray-500 underline mt-2">Batal, Nanti Saja</button>
        </div>
    </div>

    <nav id="bottom-nav" class="bottom-nav">
        <div class="nav-item active" onclick="APP.switchTab('logs')" id="tab-logs"><span class="nav-icon">🎮</span>LOGS</div>
        <div class="nav-item" onclick="APP.switchTab('input')" id="tab-input"><span class="nav-icon">📝</span>INPUT</div>
    </nav>

    <script>
        const CONFIG = {
            WEBHOOK_URL: "https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/86cee1b8-b00d-4aa6-8ff4-23735dc9afe1", 
            PRICING: {
                Paket: [ { name: "Malam", price: 50000 }, { name: "Pagi", price: 45000 }, { name: "Sore", price: 45000 }, { name: "Sultan 24H", price: 115000 } ],
                Regular: [ { name: "3 Jam", price: 30000 }, { name: "4 Jam", price: 40000 }, { name: "5 Jam", price: 50000 } ]
            }
        };

        const STATE = { 
            user: session, logs: [], activeTab: 'logs', lastFinalPrice: 0,
            activeModalRowId: null, activeModalStat: null, activeModalUnit: null, activeModalPay: null,
            activeAccId: null, activeAccPay: null
        };

        const APP = {
            init: () => {
                document.getElementById('user-info-text').innerText = `${STATE.user.username.toUpperCase()} | ${STATE.user.branch}`;
                APP.loadDashboard();
            },
            showLoader: (t) => { document.getElementById('loader-text').innerText = t; document.getElementById('loader').classList.remove('hidden'); },
            hideLoader: () => document.getElementById('loader').classList.add('hidden'),
            formatRp: (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(n || 0),
            
            getTodayStr: () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().split('T')[0]; },
            getMonthStr: () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().substring(0,7); },
            
            logout: () => { localStorage.removeItem('arena_session_v6'); window.location.href = 'index.html'; },

            api: async (p) => {
                try {
                    const r = await fetch(CONFIG.WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: p.action, data: p }) });
                    if (!r.ok) return [];
                    const txt = await r.text(); return txt ? JSON.parse(txt) : [];
                } catch (e) { return null; }
            },

            loadDashboard: async () => {
                APP.showLoader('SINKRONISASI...');
                const res = await APP.api({ action: 'get_dashboard', role: STATE.user.role, branch: STATE.user.branch });
                APP.hideLoader();

                let raw = Array.isArray(res) ? res.map((i, idx) => {
                    let data = i.json !== undefined ? i.json : i;
                    if (i.id !== undefined && data.id === undefined) { data.id = i.id; }
                    data._dbIndex = idx; 
                    return data;
                }) : [];

                STATE.logs = raw.filter(i => i.tagihan_arena !== undefined);
                APP.switchTab(STATE.activeTab);
            },

            getUnitStatus: (uNum) => {
                const unitLogs = STATE.logs.filter(l => {
                    const logNum = String(l.unit_arena).replace(/\D/g, ''); 
                    return logNum === String(uNum); 
                });
                
                unitLogs.sort((a, b) => {
                    let timeA = new Date(a.updatedAt || a.createdAt || a.jam_mulai_sewa || 0).getTime();
                    let timeB = new Date(b.updatedAt || b.createdAt || b.jam_mulai_sewa || 0).getTime();
                    if (timeA !== timeB) return timeB - timeA;
                    return b._dbIndex - a._dbIndex;
                });

                if (unitLogs.length > 0) {
                    const latestStat = String(unitLogs[0].status_unit_arena).toLowerCase();
                    if (['playing', 'main'].includes(latestStat)) return 'main';
                    if (['booked', 'book', 'pending'].includes(latestStat)) return 'book';
                }
                return 'kosong';
            },

            generateUnitOptionsHtml: (branch, targetDateStr) => {
                let units = [];
                let b = String(branch).toLowerCase();
                if(b.includes('sabang')) units = [1, 2];
                else if(b.includes('banda')) units = [3, 4, 5];
                else if(b.includes('timur') || b.includes('atim')) units = [8, 9];
                else units = [1];

                return units.map(u => {
                    const stat = APP.getUnitStatus(u); 
                    let label = `Unit ${u}`;
                    if (stat === 'main' || stat === 'book') { label += ` 🔴 (Terisi)`; } 
                    else { label += ` 🟢 (Kosong)`; }
                    return `<option value="${u}">${label}</option>`;
                }).join('');
            },

            switchTab: (tab) => {
                STATE.activeTab = tab;
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                document.getElementById(`tab-${tab}`).classList.add('active');
                
                const container = document.getElementById('main-content');
                if (tab === 'logs') { container.innerHTML = APP.renderLogsUI(); }
                else if (tab === 'input') { container.innerHTML = APP.renderInputForm(); APP.updateUnitOptions(); APP.updatePrice(); }
            },

            updateLogList: () => {
                const cabang = document.getElementById('log-filter-cabang').value;
                const status = document.getElementById('log-filter-status').value;
                document.getElementById('filtered-logs-container').innerHTML = APP.getLogListHTML(cabang, status);
            },

            closeModal: (id) => document.getElementById(id).classList.add('hidden'),
            
            toggleCancelOther: () => {
                const val = document.getElementById('cancel-reason').value;
                document.getElementById('cancel-other').classList.toggle('hidden', val !== 'Lainnya');
            },

            showCancelModal: (id, pay, unit) => {
                STATE.activeModalRowId = id; STATE.activeModalPay = pay; STATE.activeModalUnit = unit;
                document.getElementById('cancel-reason').value = 'Telat Respon';
                document.getElementById('cancel-other').value = '';
                document.getElementById('cancel-other').classList.add('hidden');
                document.getElementById('modal-cancel').classList.remove('hidden');
            },

            confirmCancel: async () => {
                let reason = document.getElementById('cancel-reason').value;
                if (reason === 'Lainnya') reason = document.getElementById('cancel-other').value || 'Alasan tidak disebutkan';
                APP.closeModal('modal-cancel');
                APP.showLoader('MEMBATALKAN...');
                await APP.api({ action: 'update_status', row_id: STATE.activeModalRowId, status_unit: 'batal', pembayaran: STATE.activeModalPay, unit: STATE.activeModalUnit, admin_name: STATE.user.username, keterangan: reason });
                await APP.loadDashboard();
            },

            handleStatusChange: (selectEl, id, pay, unit) => {
                const newVal = selectEl.value;
                if (newVal === 'batal') {
                    selectEl.value = selectEl.getAttribute('data-old-value'); 
                    APP.showCancelModal(id, pay, unit); 
                } else {
                    APP.showLoader('UPDATE STATUS...');
                    APP.api({ action: 'update_status', row_id: id, status_unit: newVal, pembayaran: pay, unit: unit, admin_name: STATE.user.username, keterangan: '' })
                       .then(() => APP.loadDashboard());
                }
            },

            handlePaymentClick: (id, currentStat, currentPay, currentUnit) => {
                if (currentPay === 'Belum') {
                    STATE.activeModalRowId = id; STATE.activeModalStat = currentStat; STATE.activeModalUnit = currentUnit;
                    document.getElementById('modal-payment').classList.remove('hidden');
                } else {
                    APP.showLoader('UPDATE BAYAR...');
                    APP.api({ action: 'update_status', row_id: id, status_unit: currentStat, pembayaran: 'Belum', unit: currentUnit, admin_name: STATE.user.username, keterangan: '' })
                       .then(() => APP.loadDashboard());
                }
            },

            confirmPayment: async (method) => {
                APP.closeModal('modal-payment');
                APP.showLoader('UPDATE BAYAR...');
                await APP.api({ action: 'update_status', row_id: STATE.activeModalRowId, status_unit: STATE.activeModalStat, pembayaran: `Lunas ${method}`, unit: STATE.activeModalUnit, admin_name: STATE.user.username, keterangan: '' });
                await APP.loadDashboard();
            },

            createMiniLogCard: (l, colorClass, badgeText) => {
                const cabLabel = l.cabang_arena === 'Banda' ? 'Banda Aceh' : l.cabang_arena;
                const ketText = l.keterangan || l.keterangan_arena || ''; 
                const reasonText = ketText ? `<p class="text-[9px] font-bold text-red-500 italic mt-0.5 border-t border-red-200 pt-0.5">"${ketText}"</p>` : '';
                let safeDate = l.jam_mulai_sewa ? String(l.jam_mulai_sewa) : (l.createdAt ? String(l.createdAt) : '');
                
                const stat = String(l.status_unit_arena).toLowerCase();
                const cancelerName = l.admin_name || l.Users || 'Sistem';
                const batalText = stat === 'batal' ? `<p class="text-[9px] font-black text-red-600 mt-1 border-t border-red-200 pt-1">Dibatalkan oleh: ${cancelerName}</p>` : '';

                return `
                <div class="border-2 border-black p-3 rounded-lg bg-white shadow-[2px_2px_0px_#000] mb-2 flex justify-between items-center">
                    <div>
                        <p class="font-black text-xs uppercase">${l.nama_pelanggan_arena} <span class="bg-gray-200 px-1 rounded text-[9px] ml-1">${l.unit_arena}</span></p>
                        <p class="text-[9px] text-gray-500 font-bold">${safeDate.substring(0,16)} | ${cabLabel}</p>
                        ${reasonText}
                        ${batalText}
                    </div>
                    <div class="text-right">
                        <p class="font-black text-sm ${colorClass}">${APP.formatRp(l.tagihan_arena)}</p>
                        <p class="text-[9px] font-bold text-gray-500 bg-gray-100 rounded-sm px-1 inline-block mt-0.5">${badgeText}</p>
                    </div>
                </div>`;
            },

            renderUnitBoxes: () => {
                let html = '<div class="grid grid-cols-3 gap-2 mb-4">';
                const activeUnits = [
                    { id: 1, label: 'SABANG' }, { id: 2, label: 'SABANG' },
                    { id: 3, label: 'BANDA' }, { id: 4, label: 'BANDA' }, { id: 5, label: 'BANDA' },
                    { id: 8, label: 'ATIM' }, { id: 9, label: 'ATIM' }
                ];

                activeUnits.forEach(u => {
                    const status = APP.getUnitStatus(u.id);
                    let bgClass = 'bg-green-500 text-white border-green-700'; 
                    let statusText = 'KOSONG';

                    if (status === 'book') { 
                        bgClass = 'bg-[#FF6B00] text-white border-orange-800';
                        statusText = 'BOOKED'; 
                    }
                    else if (status === 'main') { 
                        bgClass = 'bg-red-600 text-white border-red-800';
                        statusText = 'PLAYING'; 
                    }

                    html += `
                        <div class="border-2 rounded-lg pt-1 pb-2 px-2 text-center shadow-[2px_2px_0px_#000] ${bgClass} flex flex-col justify-center items-center relative">
                            <p class="text-[7px] font-black opacity-70 tracking-widest mb-0.5">${u.label}</p>
                            <p class="font-black text-lg leading-none">U${u.id}</p>
                            <p class="text-[9px] font-bold uppercase mt-1">${statusText}</p>
                        </div>`;
                });
                return html + '</div>';
            },

            // =====================================
            // FITUR KPI TRACKER ADMIN HARI INI
            // =====================================
            renderAdminKPI: () => {
                const todayStr = APP.getTodayStr();
                const myUsername = String(STATE.user.username).toLowerCase();

                // Saring data log yang dihandle oleh admin ini PADA HARI INI dengan status Valid (playing/finished)
                const myHandledLogs = STATE.logs.filter(l => {
                    const stat = String(l.status_unit_arena).toLowerCase();
                    const safeDate = l.jam_mulai_sewa ? String(l.jam_mulai_sewa) : (l.createdAt ? String(l.createdAt) : '');
                    const logDate = safeDate.substring(0, 10);
                    
                    // Baca dari kolom admin_creator (kebal timpa), kalau kosong fallback ke kolom Users
                    const creator = String(l.admin_creator || l.Users || '').toLowerCase();
                    
                    return creator === myUsername && logDate === todayStr && ['playing', 'main', 'finished', 'selesai'].includes(stat);
                });

                const count = myHandledLogs.length;
                let bonusText = 'Kejar 27 trx untuk aman dari SP!';
                let barColor = 'bg-blue-500';

                if (count >= 40) { bonusText = '🎉 BONUS 20% TERKUCI!'; barColor = 'bg-green-500'; }
                else if (count >= 35) { bonusText = '🔥 BONUS 15% TERKUCI! (Kejar 40 max)'; barColor = 'bg-yellow-400'; }
                else if (count >= 27) { bonusText = '✅ TARGET AMAN! (Kejar 35 u/ Bonus 15%)'; barColor = 'bg-green-400'; }

                let listHtml = myHandledLogs.map((l, i) => `
                    <div class="flex justify-between items-center border-b border-dashed border-gray-300 py-1.5 px-2 hover:bg-gray-100 rounded">
                        <span class="text-[10px] font-bold truncate"><span class="text-blue-600 mr-1">${i+1}.</span> ${l.nama_pelanggan_arena}</span>
                        <span class="text-[8px] bg-white border border-gray-400 px-1.5 py-0.5 rounded font-black shadow-sm">${String(l.status_unit_arena).toUpperCase()}</span>
                    </div>
                `).join('');

                if(myHandledLogs.length === 0) listHtml = '<p class="text-center text-[10px] text-gray-500 italic py-3">Belum ada pelanggan yang kamu proses hari ini.</p>';

                return `
                <div class="mb-6 border-4 border-black rounded-xl p-4 bg-[#f8fafc] shadow-[4px_4px_0px_#000]">
                    <h3 class="font-black text-[#FF6B00] mb-2 text-center uppercase border-b-2 border-black pb-2 flex items-center justify-center gap-1"><span>🎯</span> TRACKER KPI ADMIN</h3>
                    
                    <div class="flex justify-between items-end mb-1">
                        <span class="text-xs font-black">Total Dihandle: <span class="text-xl text-[#FF6B00]">${count}</span></span>
                        <span class="text-[9px] font-bold text-gray-500">Min: 27 | Max: 40</span>
                    </div>
                    
                    <div class="w-full bg-gray-300 rounded-full h-4 border-2 border-black relative overflow-hidden mb-2">
                        <div class="${barColor} h-full transition-all duration-500" style="width: ${Math.min((count/40)*100, 100)}%"></div>
                        <div class="absolute top-0 bottom-0 border-l-2 border-black" style="left: ${(27/40)*100}%;"></div>
                        <div class="absolute top-0 bottom-0 border-l-2 border-black" style="left: ${(35/40)*100}%;"></div>
                    </div>
                    
                    <p class="text-[10px] font-black text-center mb-3 ${count >= 27 ? 'text-green-600' : 'text-red-500'}">${bonusText}</p>
                    
                    <div class="flex gap-1 mb-3">
                        <div class="flex-1 text-center border-2 border-black rounded py-1 ${count >= 27 ? 'bg-green-400' : 'bg-gray-200 opacity-50 shadow-none'} shadow-[2px_2px_0px_#000]">
                            <p class="text-[8px] font-black">MIN 27</p>
                        </div>
                        <div class="flex-1 text-center border-2 border-black rounded py-1 ${count >= 35 ? 'bg-yellow-400' : 'bg-gray-200 opacity-50 shadow-none'} shadow-[2px_2px_0px_#000]">
                            <p class="text-[8px] font-black">+15% (35)</p>
                        </div>
                        <div class="flex-1 text-center border-2 border-black rounded py-1 ${count >= 40 ? 'bg-blue-500 text-white' : 'bg-gray-200 opacity-50 shadow-none'} shadow-[2px_2px_0px_#000]">
                            <p class="text-[8px] font-black">+20% (40)</p>
                        </div>
                    </div>

                    <div class="bg-white border-2 border-black rounded-lg max-h-[120px] overflow-y-auto custom-scroll">
                        <div class="sticky top-0 bg-gray-800 text-white text-center">
                            <p class="text-[9px] font-black py-1 tracking-widest">BUKU SAKU (HARI INI)</p>
                        </div>
                        <div class="p-1">${listHtml}</div>
                    </div>
                </div>
                `;
            },

            renderSingleLogCard: (l) => {
                const rowId = l.id || l.row_number || l._rowIndex || '';
                const unitLabel = String(l.unit_arena).toLowerCase().includes('unit') ? l.unit_arena : 'Unit ' + l.unit_arena;
                const cabLabel = l.cabang_arena === 'Banda' ? 'Banda Aceh' : l.cabang_arena;

                const daysName = ['MINGGU', 'SENIN', 'SELASA', 'RABU', 'KAMIS', 'JUMAT', 'SABTU'];
                let dayStr = '';
                let safeDate = l.jam_mulai_sewa ? String(l.jam_mulai_sewa) : (l.createdAt ? String(l.createdAt) : '');
                
                if (safeDate) {
                    const dObj = new Date(safeDate.replace(' ', 'T'));
                    if (!isNaN(dObj)) dayStr = daysName[dObj.getDay()];
                }
                const waLink = l.link_wa_pelanggan_arena || 'https://wa.me/' + String(l.nomor_pelanggan_arena).replace(/^0/, '62');
                const stat = String(l.status_unit_arena).toLowerCase();
                const pay = l.pembayaran;
                const cancelerName = l.admin_name || l.Users || 'Sistem';

                let cardClass = "border-2 border-black p-3 rounded-xl bg-white shadow-[2px_2px_0px_#000] relative";
                let textClass = ""; let badgeHtml = "";

                let payBtnClass = 'bg-red-400 text-white';
                let payBtnText = '❌ BELUM';
                if (pay === 'Lunas Cash') { payBtnClass = 'bg-green-400 text-black'; payBtnText = '💵 CASH'; }
                else if (pay === 'Lunas Transfer') { payBtnClass = 'bg-blue-500 text-white'; payBtnText = '📱 TF'; }
                else if (pay === 'Lunas' || pay === 'lunas') { payBtnClass = 'bg-green-400 text-black'; payBtnText = '✅ LUNAS'; }

                if (stat === 'batal') {
                    cardClass = "border-2 border-gray-400 p-3 rounded-xl bg-gray-200 opacity-75 relative";
                    textClass = "line-through text-gray-500";
                    badgeHtml = `<div class="bg-red-600 text-white text-[9px] font-black px-2 py-1 absolute top-0 right-0 rounded-bl-lg rounded-tr-lg shadow-md z-10">❌ BATAL: ${cancelerName.toUpperCase()}</div>`;
                } else if (stat === 'booked' || stat === 'book') {
                    cardClass = "border-2 border-[#FF6B00] p-3 rounded-xl bg-orange-50 shadow-[2px_2px_0px_#ea580c] relative";
                } else if (stat === 'playing' || stat === 'main') {
                    cardClass = "border-2 border-red-500 p-3 rounded-xl bg-red-50 shadow-[2px_2px_0px_#ef4444] relative";
                    badgeHtml = `<span class="absolute top-3 right-3 flex h-3 w-3"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span></span>`;
                } else if (stat === 'finished' || stat === 'selesai') {
                    if (pay === 'Belum' || !pay) {
                        cardClass = "border-4 border-red-600 p-3 rounded-xl bg-red-50 shadow-[2px_2px_0px_#dc2626] relative";
                        badgeHtml = `<div class="bg-red-600 text-white text-[9px] font-black px-2 py-1 absolute top-0 right-0 rounded-bl-lg rounded-tr-lg animate-pulse shadow-md">⚠️ BELUM BAYAR</div>`;
                    } else {
                        cardClass = "border-2 border-gray-400 p-3 rounded-xl bg-gray-100 shadow-[2px_2px_0px_gray] relative";
                    }
                }

                const ongkirValue = l.ongkir || l.ongkir_arena || 0;
                const ongkirLabel = Number(ongkirValue) > 0 ? `<span class="text-[9px] font-bold text-blue-600 bg-blue-100 px-1 border border-blue-300 rounded ml-1">+ Ongkir ${APP.formatRp(ongkirValue)}</span>` : '';

                return `
                <div class="${cardClass} mb-2">
                    ${badgeHtml}
                    <div class="flex justify-between items-start mb-2 border-b-2 border-dashed border-gray-300 pb-2">
                        <div class="flex flex-col">
                            <span class="font-black text-xl text-[#FF6B00] leading-none mb-1 ${textClass}">${dayStr}</span>
                            <span class="font-bold text-[10px] text-gray-500">${safeDate.substring(0,16)}</span>
                        </div>
                        <span class="font-black text-[10px] bg-black text-white px-2 py-1 rounded-md h-fit mt-1">${unitLabel} (${cabLabel})</span>
                    </div>
                    <p class="font-bold text-sm uppercase ${textClass}">${l.nama_pelanggan_arena} <span class="text-[10px] text-gray-500 normal-case ml-1">${l.nomor_pelanggan_arena || ''}</span></p>
                    <div class="flex justify-between items-end mt-1">
                        <div class="flex flex-col">
                            <span class="text-xs font-semibold text-gray-700 ${textClass}">${l.paket_arena}</span>
                            ${ongkirLabel}
                        </div>
                        <span class="text-sm font-black text-orange-600 ${textClass}">${APP.formatRp(l.tagihan_arena)}</span>
                    </div>
                    <div class="flex gap-1 mt-3 pt-2 border-t border-gray-200">
                        <select data-old-value="${stat}" onchange="APP.handleStatusChange(this, '${rowId}', '${l.pembayaran}', '${l.unit_arena}')" class="mario-input p-1 text-[9px] w-1/3 font-bold">
                            <option value="booked" ${stat==='booked'?'selected':''}>BOOKED</option>
                            <option value="playing" ${stat==='playing'?'selected':''}>PLAYING</option>
                            <option value="finished" ${stat==='finished'?'selected':''}>FINISHED</option>
                            <option value="batal" ${stat==='batal'?'selected':''}>BATAL ❌</option>
                        </select>
                        <button onclick="APP.handlePaymentClick('${rowId}', '${l.status_unit_arena}', '${l.pembayaran}', '${l.unit_arena}')" class="mario-btn p-1 text-[9px] w-1/3 ${payBtnClass}">
                            ${payBtnText}
                        </button>
                        <a href="${waLink}" target="_blank" class="mario-btn p-1 text-[10px] w-1/3 bg-[#25D366] text-white flex items-center justify-center font-black">
                            💬 WA
                        </a>
                    </div>
                </div>`;
            },

            renderLogsUI: () => {
                const pendingLogs = STATE.logs.filter(l => String(l.status_unit_arena).toLowerCase() === 'pending');
                let pendingHtml = '';
                
                if (pendingLogs.length > 0) {
                    pendingHtml = `
                    <div class="mb-6 p-4 border-4 border-red-500 bg-red-100 rounded-xl shadow-[4px_4px_0px_#ef4444] animate-pulse">
                        <h3 class="font-black text-red-600 mb-3 text-center uppercase flex items-center justify-center gap-2"><span>🚨</span> PESANAN BARU! <span>🚨</span></h3>
                        <div class="space-y-3">
                            ${pendingLogs.map(l => {
                                const rowId = l.id || l.row_number || l._rowIndex || '';
                                const cabLabel = l.cabang_arena === 'Banda' ? 'Banda Aceh' : l.cabang_arena;
                                let safeDate = l.jam_mulai_sewa ? String(l.jam_mulai_sewa) : (l.createdAt ? String(l.createdAt) : '');
                                const tglMainStr = safeDate.substring(0,10);
                                
                                const ongkirValue = l.ongkir || l.ongkir_arena || 0;
                                const ongkirTxt = Number(ongkirValue) > 0 ? ` <br><span class="text-blue-600 text-xs">+ Ongkir ${APP.formatRp(ongkirValue)}</span>` : '';

                                return `
                                <div class="border-2 border-black p-3 bg-white rounded-lg">
                                    <div class="flex justify-between">
                                        <p class="font-black text-sm uppercase">${l.nama_pelanggan_arena}</p>
                                        <p class="font-black text-sm text-[#FF6B00] text-right">${APP.formatRp(l.tagihan_arena)}${ongkirTxt}</p>
                                    </div>
                                    <p class="text-[10px] font-bold text-gray-600 mb-1">Pesan: ${l.paket_arena} | ${cabLabel}</p>
                                    <p class="text-[10px] font-bold text-red-600 mb-3 bg-red-100 inline-block px-2 py-0.5 rounded">Main: ${safeDate.substring(0,16) || '-'}</p>
                                    
                                    <div class="flex gap-2 mt-2 border-t-2 border-dashed border-gray-300 pt-2">
                                        <button onclick="APP.openAccModal('${rowId}', '${l.pembayaran}', '${l.cabang_arena}', '${tglMainStr}')" class="mario-btn bg-green-500 text-white p-2 text-xs font-black px-2 flex-1 border-green-700">ACC PESANAN ✅</button>
                                        <button onclick="APP.showCancelModal('${rowId}', '${l.pembayaran}', 'Batal')" class="mario-btn bg-red-500 text-white p-2 text-xs font-black px-2 flex-1 border-red-700">TOLAK ❌</button>
                                    </div>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>`;
                }

                // Inject KPI Tracker Component Here
                const adminKPIHtml = APP.renderAdminKPI();

                return `
                    <div class="mario-card p-4 animate-pop">
                        ${pendingHtml}
                        ${adminKPIHtml}
                        <h2 class="font-black text-center border-b-2 border-black pb-2 mb-4 uppercase">Status 7 Unit</h2>
                        <div id="dashboard-unit-boxes">${APP.renderUnitBoxes()}</div>
                        <div class="flex justify-between items-end mb-3 mt-4 border-t-2 border-dashed border-gray-400 pt-4">
                            <h3 class="font-black text-[11px] w-1/3">LOGS BULAN INI</h3>
                            <div class="flex gap-1 w-2/3 justify-end">
                                <select id="log-filter-cabang" onchange="APP.updateLogList()" class="mario-input p-1 text-[9px] font-bold" style="width:48%">
                                    <option value="ALL">Semua Cabang</option><option value="Sabang">Sabang</option><option value="Banda">Banda Aceh</option><option value="Aceh Timur">Aceh Timur</option>
                                </select>
                                <select id="log-filter-status" onchange="APP.updateLogList()" class="mario-input p-1 text-[9px] font-bold text-gray-700" style="width:48%">
                                    <option value="ALL">Semua Status</option>
                                    <option value="booked">Booked ⏳</option>
                                    <option value="playing">Playing 🔴</option>
                                    <option value="finished">Finished ✅</option>
                                    <option value="batal">Batal ❌</option>
                                </select>
                            </div>
                        </div>
                        <div id="filtered-logs-container" class="space-y-3">${APP.getLogListHTML('ALL', 'ALL')}</div>
                    </div>
                `;
            },

            getLogListHTML: (cabangFilter, statusFilter = 'ALL') => {
                const monthStr = APP.getMonthStr(); 
                
                const recentLogs = STATE.logs.filter(l => { 
                    let safeDate = l.jam_mulai_sewa ? String(l.jam_mulai_sewa) : (l.createdAt ? String(l.createdAt) : '');
                    let dStr = safeDate.substring(0,7);
                    return dStr === monthStr || dStr === ''; 
                });

                const filtered = recentLogs.filter(l => {
                    const stat = String(l.status_unit_arena).toLowerCase();
                    if (stat === 'pending') return false; 
                    if (statusFilter !== 'ALL' && stat !== statusFilter) return false; 
                    return true;
                });

                if (cabangFilter === 'ALL') {
                    let groupedHtml = '';
                    ['Banda', 'Sabang', 'Aceh Timur'].forEach(b => {
                        const bLogs = filtered.filter(l => l.cabang_arena === b || (b==='Banda'&&l.cabang_arena==='Banda Aceh') || (b==='Aceh Timur'&&l.cabang_arena==='Atim'));
                        if (bLogs.length > 0) {
                            let listStr = bLogs.reverse().map(l => APP.renderSingleLogCard(l)).join('');
                            groupedHtml += `
                                <div class="mb-4">
                                    <h4 class="font-black text-[10px] bg-black text-white p-2 rounded-t-lg uppercase">${b === 'Banda' ? 'BANDA ACEH' : b}</h4>
                                    <div class="border-2 border-black border-t-0 p-2 rounded-b-lg bg-gray-50">${listStr}</div>
                                </div>`;
                        }
                    });
                    return groupedHtml || '<p class="text-center font-bold text-gray-500">Tidak ada log di bulan ini.</p>';
                } else {
                    const bLogs = filtered.filter(l => l.cabang_arena === cabangFilter || (cabangFilter==='Banda'&&l.cabang_arena==='Banda Aceh') || (cabangFilter==='Aceh Timur'&&l.cabang_arena==='Atim'));
                    return bLogs.reverse().map(l => APP.renderSingleLogCard(l)).join('') || '<p class="text-center font-bold text-gray-500">Tidak ada log di bulan ini.</p>';
                }
            },

            openAccModal: (id, pay, branch, dateStr) => {
                STATE.activeAccId = id;
                STATE.activeAccPay = pay;
                document.getElementById('acc-modal-unit').innerHTML = APP.generateUnitOptionsHtml(branch, dateStr);
                document.getElementById('modal-acc').classList.remove('hidden');
            },

            confirmAccBooking: async () => {
                const unitSel = document.getElementById('acc-modal-unit').value;
                APP.closeModal('modal-acc');
                APP.showLoader('MENGKONFIRMASI...');
                await APP.api({ action: 'update_status', row_id: STATE.activeAccId, status_unit: 'booked', pembayaran: STATE.activeAccPay, unit: unitSel, admin_name: STATE.user.username, keterangan: '' });
                await APP.loadDashboard();
            },

            renderInputForm: () => {
                const now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                const minDate = now.toISOString().slice(0,16);
                
                const maxD = new Date(now);
                maxD.setDate(maxD.getDate() + 7);
                const maxDate = maxD.toISOString().slice(0,16);

                const b = STATE.user.branch || ''; 
                return `
                <div class="mario-card p-5 animate-pop">
                    <h2 class="font-black text-center border-b-2 border-black pb-2 mb-4">INPUT TRANSAKSI</h2>
                    <form onsubmit="APP.saveRental(event)" class="space-y-3">
                        <div class="grid grid-cols-2 gap-2"><div><label class="text-[10px] font-bold">PELANGGAN</label><input type="text" id="r-name" placeholder="Nama" required class="mario-input p-2 text-sm"></div><div><label class="text-[10px] font-bold">NO WA</label><input type="number" id="r-wa" placeholder="08xx" required class="mario-input p-2 text-sm"></div></div>
                        <div class="grid grid-cols-2 gap-2">
                            <div><label class="text-[10px] font-bold">CABANG</label>
                                <select id="r-branch" onchange="APP.updateUnitOptions()" class="mario-input p-2 text-sm">
                                    <option value="Banda" ${b.includes('Banda')?'selected':''}>Banda Aceh</option>
                                    <option value="Sabang" ${b.includes('Sabang')?'selected':''}>Sabang</option>
                                    <option value="Aceh Timur" ${b.includes('Timur')?'selected':''}>Aceh Timur</option>
                                </select>
                            </div>
                            <div><label class="text-[10px] font-bold">UNIT</label><select id="r-unit" class="mario-input p-2 text-sm" required></select></div>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-2"><div><label class="text-[10px] font-bold">TIPE SEWA</label><select id="r-type" onchange="APP.updatePrice()" class="mario-input p-2 text-sm"><option value="Paket">Paket</option><option value="Regular">Regular</option></select></div><div><label class="text-[10px] font-bold">AMUNISI</label><select id="r-prod" onchange="APP.updatePrice()" class="mario-input p-2 text-sm"></select></div></div>
                        
                        <div id="logistik-admin-container" class="bg-[#FFE8B3] border-2 border-black p-3 rounded-lg hidden mt-2 mb-2 shadow-[2px_2px_0px_#000]">
                            <label class="text-[10px] font-black uppercase text-center block mb-2">Logistik (Khusus Banda)</label>
                            <div class="grid grid-cols-2 gap-2">
                                <select id="r-delivery" onchange="APP.updatePrice()" class="mario-input p-2 text-xs font-bold border-yellow-600">
                                    <option value="ambil">Ambil di Markas</option>
                                    <option value="antar">Antar ke Lokasi</option>
                                </select>
                                <input type="number" id="r-ongkir" placeholder="Ongkir (Rp)" min="0" value="0" onkeyup="APP.updatePrice()" onchange="APP.updatePrice()" class="mario-input p-2 text-xs border-blue-500 hidden">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div><label class="text-[10px] font-bold text-blue-700">TGL/WAKTU MAIN</label><input type="datetime-local" id="r-datetime" value="${minDate}" min="${minDate}" max="${maxDate}" onchange="APP.updateUnitOptions()" required class="mario-input p-2 text-sm border-blue-500"></div>
                            <div><label class="text-[10px] font-bold text-red-600">DISKON (Rp)</label><input type="number" id="r-diskon" placeholder="0" min="0" onkeyup="APP.updatePrice()" onchange="APP.updatePrice()" class="mario-input p-2 text-sm border-red-500 focus:border-red-600"></div>
                        </div>

                        <div>
                            <label class="text-[10px] font-bold block mb-1">STATUS PEMBAYARAN (AWAL)</label>
                            <select id="r-pay-status" class="mario-input p-2 text-sm font-black text-gray-700">
                                <option value="Belum">❌ Belum Bayar</option>
                                <option value="Lunas Cash">💵 Lunas (Cash)</option>
                                <option value="Lunas Transfer">📱 Lunas (Transfer)</option>
                            </select>
                        </div>

                        <div class="bg-black text-yellow-400 p-3 rounded-lg text-center mt-2"><p class="text-[10px] font-bold text-gray-300">TOTAL TAGIHAN</p><p id="price-tag" class="text-2xl font-black">Rp 0</p></div>
                        <button type="submit" class="w-full mario-btn bg-yellow-400 p-3 mt-4">SIMPAN 💾</button>
                    </form>
                </div>`;
            },

            updateUnitOptions: () => {
                const branch = document.getElementById('r-branch').value;
                const unitSel = document.getElementById('r-unit');
                const logistikBox = document.getElementById('logistik-admin-container');
                const dateStr = document.getElementById('r-datetime').value.substring(0,10) || APP.getTodayStr();
                
                if(!unitSel) return;
                
                if (branch === 'Banda') { logistikBox.classList.remove('hidden'); } 
                else { logistikBox.classList.add('hidden'); document.getElementById('r-ongkir').value = 0; document.getElementById('r-delivery').value = 'ambil'; }

                unitSel.innerHTML = APP.generateUnitOptionsHtml(branch, dateStr);
                APP.updatePrice();
            },

            updatePrice: () => {
                const type = document.getElementById('r-type').value;
                const prodSel = document.getElementById('r-prod');
                
                const deliveryMode = document.getElementById('r-delivery') ? document.getElementById('r-delivery').value : 'ambil';
                const ongkirInput = document.getElementById('r-ongkir');
                if (ongkirInput) ongkirInput.classList.toggle('hidden', deliveryMode !== 'antar');
                if (deliveryMode === 'ambil' && ongkirInput) ongkirInput.value = 0;
                
                if(prodSel.options.length === 0 || document.getElementById('r-type').dataset.last !== type) {
                    prodSel.innerHTML = CONFIG.PRICING[type].map((p,i) => `<option value="${i}">${p.name} ${p.time!=='Bebas'?'('+p.time+')':''}</option>`).join('');
                    document.getElementById('r-type').dataset.last = type;
                }
                
                const basePrice = CONFIG.PRICING[type][prodSel.value].price;
                const diskonVal = Number(document.getElementById('r-diskon') ? document.getElementById('r-diskon').value : 0) || 0;
                const ongkirVal = Number(ongkirInput ? ongkirInput.value : 0) || 0;
                
                let finalCalc = basePrice - diskonVal + ongkirVal;
                if (finalCalc < 0) finalCalc = 0; 
                
                STATE.lastFinalPrice = finalCalc;
                document.getElementById('price-tag').innerText = APP.formatRp(finalCalc);
            },

            saveRental: async (e) => {
                e.preventDefault();
                APP.showLoader('MENYIMPAN...');
                try {
                    const type = document.getElementById('r-type').value;
                    const prodSel = document.getElementById('r-prod');
                    const rawDate = document.getElementById('r-datetime').value || ''; 
                    const formattedDate = rawDate ? rawDate.replace('T', ' ') + (rawDate.length === 16 ? ':00' : '') : '';
                    
                    const finalName = CONFIG.PRICING[type][prodSel.value].name;
                    const diskonVal = Number(document.getElementById('r-diskon').value) || 0;
                    const ongkirVal = Number(document.getElementById('r-ongkir') ? document.getElementById('r-ongkir').value : 0) || 0;
                    const payStatus = document.getElementById('r-pay-status').value;
                    
                    let finalPaket = `${finalName} (${type})`;
                    if (diskonVal > 0) { finalPaket += ` [Diskon ${APP.formatRp(diskonVal)}]`; }

                    await APP.api({
                        action: 'input_rental',
                        name: document.getElementById('r-name').value, wa: document.getElementById('r-wa').value, 
                        branch: document.getElementById('r-branch').value, unit: document.getElementById('r-unit').value,
                        price: STATE.lastFinalPrice, admin_name: STATE.user.username, status_unit: 'booked', pembayaran: payStatus,
                        paket: finalPaket, jam_mulai_sewa: formattedDate, ongkir: ongkirVal,
                        book_channel: 'Manual (Admin)'
                    });
                    await APP.loadDashboard();
                    APP.switchTab('logs'); 
                } catch (error) {
                    alert("Gagal memproses input.");
                    APP.hideLoader();
                }
            }
        };

        window.onload = APP.init;
    </script>
</body>
</html>
