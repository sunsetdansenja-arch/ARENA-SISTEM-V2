<!DOCTYPE html>
<html lang="id">
<head>

            console.log("Service Worker dibunuh: ", boolean);

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARENA SYSTEM - Secure Login</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/sunsetdansenja-arch/bot-arrena-assets/main/logo%20arena%20gaming.png">
    
    <link rel="icon" href="https://raw.githubusercontent.com/sunsetdansenja-arch/bot-arrena-assets/main/logo%20arena%20gaming.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --mario-orange: #FF6B00; --mario-black: #000000; --mario-yellow: #FFD700; }
        body { font-family: 'Fredoka', sans-serif; background-color: var(--mario-orange); color: var(--mario-black); -webkit-font-smoothing: antialiased; background-image: radial-gradient(rgba(0,0,0,0.05) 2px, transparent 2px); background-size: 20px 20px; }
        .mario-card { background-color: white; border: 4px solid var(--mario-black); border-radius: 16px; box-shadow: 6px 6px 0px 0px var(--mario-black); }
        .mario-btn { background-color: white; border: 4px solid var(--mario-black); border-radius: 12px; box-shadow: 4px 4px 0px 0px var(--mario-black); transition: all 0.1s ease-in-out; font-weight: 700; text-align: center; cursor: pointer; }
        .mario-btn:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px 0px var(--mario-black); }
        .mario-input { width: 100%; background-color: #F3F4F6; border: 3px solid var(--mario-black); border-radius: 8px; padding: 10px; font-weight: 600; outline: none; }
        .mario-input:focus { border-color: var(--mario-orange); background-color: white; }
        
        #loader { position: fixed; inset: 0; background: rgba(255,107,0,0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .spinner { width: 50px; height: 50px; border: 6px solid var(--mario-black); border-top-color: var(--mario-yellow); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }
        .animate-pop { animation: popIn 0.3s forwards; }
        @keyframes popIn { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="loader" class="hidden">
        <div class="spinner mb-4"></div>
        <h2 id="loader-text" class="text-xl font-black text-white uppercase tracking-widest">VERIFIKASI...</h2>
    </div>

    <main class="w-full max-w-md animate-pop">
        <div class="text-center mb-6">
            <div class="inline-block p-2 bg-white border-4 border-black rounded-full shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] mb-4">
                <img src="https://raw.githubusercontent.com/sunsetdansenja-arch/bot-arrena-assets/main/logo%20arena%20gaming.png" alt="Arena Playbox" class="h-16 w-16 object-contain rounded-full">
            </div>
            <h1 class="text-2xl font-black text-white" style="text-shadow: 2px 2px 0px #000;">ARENA PLAYBOX</h1>
            <p class="text-xs font-bold text-yellow-300">Central Authorization Gateway</p>
        </div>

        <section class="mario-card p-6">
            <h2 class="text-xl font-black mb-6 text-center border-b-4 border-black pb-2 uppercase">Login Sistem</h2>
            <form id="form-login" class="space-y-4">
                <div>
                    <label class="text-xs font-bold">USERNAME</label>
                    <input type="text" id="login-user" required class="mario-input">
                </div>
                <div>
                    <label class="text-xs font-bold">PASSWORD</label>
                    <input type="password" id="login-pass" required class="mario-input">
                </div>
                <button type="submit" class="w-full mario-btn bg-[#FFD700] p-4 text-lg mt-4">MASUK 🚀</button>
            </form>
        </section>
    </main>

    <script>
        // Ganti URL Webhook ini kalau n8n lu ganti URL
        const WEBHOOK_URL = "https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/86cee1b8-b00d-4aa6-8ff4-23735dc9afe1";

        const GATEWAY = {
            init: () => {
                document.getElementById('form-login').addEventListener('submit', GATEWAY.handleLogin);
                GATEWAY.checkExistingSession();
            },

            showLoader: (text) => {
                document.getElementById('loader-text').innerText = text;
                document.getElementById('loader').classList.remove('hidden');
            },

            hideLoader: () => {
                document.getElementById('loader').classList.add('hidden');
            },

            redirectByRole: (role) => {
                const r = String(role).toLowerCase().trim();
                if (r === 'manager') {
                    window.location.href = 'manager.html';
                } else if (r.startsWith('sh') || r === 'owner') {
                    window.location.href = 'owner.html';
                } else if (r === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    alert("Akses Ditolak: Role tidak dikenali.");
                    localStorage.removeItem('arena_session_v6');
                }
            },

            checkExistingSession: () => {
                const saved = localStorage.getItem('arena_session_v6');
                if (saved) {
                    try {
                        const user = JSON.parse(saved);
                        if (user && user.role) {
                            GATEWAY.redirectByRole(user.role);
                        }
                    } catch (e) {
                        localStorage.removeItem('arena_session_v6');
                    }
                }
            },

            handleLogin: async (e) => {
                e.preventDefault();
                GATEWAY.showLoader('MENGHUBUNGI SERVER...');
                
                const user = document.getElementById('login-user').value;
                const pass = document.getElementById('login-pass').value;

                try {
                    const response = await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'login', data: { username: user, password: pass } })
                    });

                    if (!response.ok) throw new Error("Network response was not ok");
                    
                    const data = await response.json();
                    let rawUser = Array.isArray(data) ? (data[0]?.json || data[0]) : (data?.json || data);

                    GATEWAY.hideLoader();

                    if (rawUser && rawUser.role) {
                        // Tentukan Cabang
                        let uBranch = "Semua Cabang";
                        let roleStr = String(rawUser.role).toLowerCase().trim();
                        
                        if(roleStr.startsWith('sh')) {
                            if(roleStr.includes('sabang')) uBranch = 'Sabang';
                            else if(roleStr.includes('banda')) uBranch = 'Banda'; 
                            else if(roleStr.includes('atim') || roleStr.includes('aceh timur')) uBranch = 'Aceh Timur';
                        } else {
                            if(rawUser.cabang_arena || rawUser.cabang) uBranch = rawUser.cabang_arena || rawUser.cabang;
                        }

                        // Simpan Session
                        const sessionData = {
                            username: rawUser.id_user_arena || rawUser.Users || 'User',
                            role: roleStr,
                            branch: uBranch
                        };
                        localStorage.setItem('arena_session_v6', JSON.stringify(sessionData));

                        // Lempar ke HTML yang Sesuai
                        GATEWAY.redirectByRole(roleStr);

                    } else {
                        alert("❌ Gagal Login. Periksa Username/Password Anda.");
                    }
                } catch (error) {
                    GATEWAY.hideLoader();
                    alert("❌ Gagal Terhubung ke Server n8n.");
                    console.error(error);
                }
            }
        };

        // Mulai Gatekeeper
        GATEWAY.init();
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('PWA Arena Sukses Didaftarkan!', reg))
                    .catch(err => console.log('PWA Gagal:', err));
            });
        }
    </script>
</body>
</html>
