<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARENA MANAGER - Executive Dashboard</title>
    
    <link rel="icon" href="https://raw.githubusercontent.com/sunsetdansenja-arch/bot-arrena-assets/main/logo%20arena%20gaming.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f2f2f7; color: #1c1c1e; }
        .apple-card { background: white; border-radius: 24px; box-shadow: 0 4px 20px -2px rgba(0,0,0,0.04), 0 2px 8px -2px rgba(0,0,0,0.02); }
        .glass-header { background: rgba(242, 242, 247, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .menu-btn { transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s; }
        .menu-btn:active { transform: scale(0.96); box-shadow: none; }
        .progress-bar-stripes { background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.15) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.15) 50%, rgba(255, 255, 255, 0.15) 75%, transparent 75%, transparent); background-size: 1rem 1rem; animation: progress-animation 1s linear infinite; }
        @keyframes progress-animation { from { background-position: 1rem 0; } to { background-position: 0 0; } }
        
        #loader { position: fixed; inset: 0; background: #f2f2f7; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e5e5ea; border-top-color: #007aff; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }
    </style>
</head>
<body class="pb-10">

    <script>
        const session = JSON.parse(localStorage.getItem('arena_session_v6'));
        if (!session || session.role !== 'manager') window.location.href = 'index.html';
    </script>

    <div id="loader">
        <div class="spinner mb-4"></div>
        <h2 class="text-sm font-bold text-gray-500 tracking-widest uppercase">Menganalisis Data...</h2>
    </div>

    <!-- Sticky Header -->
    <header class="w-full glass-header sticky top-0 z-40 px-4 md:px-8 py-4 mb-6 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img src="https://raw.githubusercontent.com/sunsetdansenja-arch/bot-arrena-assets/main/logo%20arena%20gaming.png" class="h-10 w-10 bg-black p-1.5 rounded-xl shadow-md">
            <div>
                <h1 class="text-xl font-black text-black tracking-tight leading-none">Arena Executive</h1>
                <p id="date-text" class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mt-1">SINKRONISASI...</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="APP.loadDashboard()" class="bg-blue-100 hover:bg-blue-200 text-blue-700 font-bold w-10 h-10 rounded-full flex items-center justify-center transition-colors">🔄</button>
            <button onclick="APP.logout()" class="bg-gray-200 hover:bg-red-100 text-gray-700 hover:text-red-600 font-bold w-10 h-10 rounded-full flex items-center justify-center transition-colors">🚪</button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 md:px-6 space-y-6">
        
        <!-- TARGET MANAJER SECTION -->
        <section class="apple-card p-6 bg-gradient-to-br from-gray-900 to-black text-white relative overflow-hidden">
            <div class="absolute -right-10 -top-10 opacity-10 text-9xl">🎯</div>
            <div class="relative z-10">
                <div class="flex justify-between items-end mb-2">
                    <div>
                        <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-1">Target Manajer (Bulan Ini)</h2>
                        <div class="text-4xl font-black"><span id="mgr-current">0</span> <span class="text-xl text-gray-500 font-bold">/ 150 Trx</span></div>
                    </div>
                    <div class="text-right">
                        <span id="mgr-percent" class="text-2xl font-black text-[#FFD700]">0%</span>
                    </div>
                </div>
                <div class="w-full bg-gray-800 rounded-full h-4 mt-4 overflow-hidden shadow-inner">
                    <div id="mgr-progress" class="bg-[#FFD700] progress-bar-stripes h-full rounded-full transition-all duration-1000" style="width: 0%"></div>
                </div>
                <p id="mgr-status-text" class="text-xs font-semibold text-gray-400 mt-3"></p>
            </div>
        </section>

        <!-- INFOGRAFIS INSIGHTS (4 Kotak) -->
        <h2 class="text-lg font-black text-gray-800 px-2 mt-8">Decision Making Insights</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="apple-card p-5 border border-gray-100 flex flex-col justify-between">
                <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 mb-3 text-lg">📈</div>
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Rata-Rata Harian</p>
                <p id="insight-daily" class="text-2xl font-black text-gray-900 mt-1">0 <span class="text-xs font-bold text-gray-500">trx/hari</span></p>
            </div>
            <div class="apple-card p-5 border border-gray-100 flex flex-col justify-between">
                <div class="w-8 h-8 rounded-full bg-green-100 flex items-center justify-center text-green-600 mb-3 text-lg">🔥</div>
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Hari Tersibuk</p>
                <p id="insight-maxday" class="text-base font-black text-gray-900 mt-1 leading-tight">-<br><span id="insight-maxcount" class="text-xs font-bold text-green-600">0 trx</span></p>
            </div>
            <div class="apple-card p-5 border border-gray-100 flex flex-col justify-between">
                <div class="w-8 h-8 rounded-full bg-purple-100 flex items-center justify-center text-purple-600 mb-3 text-lg">💰</div>
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Nilai Rata-rata</p>
                <p id="insight-avgval" class="text-xl font-black text-gray-900 mt-1">Rp 0</p>
            </div>
            <div class="apple-card p-5 border border-gray-100 flex flex-col justify-between">
                <div class="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center text-red-600 mb-3 text-lg">⚠️</div>
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Cancel Rate</p>
                <p id="insight-cancel" class="text-2xl font-black text-red-600 mt-1">0%</p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-2">
            <!-- DISTRIBUSI CABANG -->
            <section class="apple-card p-6 border border-gray-100 flex flex-col">
                <h3 class="text-sm font-black text-gray-800 uppercase tracking-widest mb-6">Distribusi Cabang</h3>
                <div id="branch-dist" class="space-y-5 flex-grow">
                    <!-- Branch info diisi via JS -->
                </div>
            </section>

            <!-- KPI ADMIN -->
            <section class="apple-card p-6 border border-gray-100">
                <h3 class="text-sm font-black text-gray-800 uppercase tracking-widest mb-6 flex justify-between items-center">
                    <span>🏆 Peringkat KPI Admin</span>
                </h3>
                <div id="kpi-list" class="space-y-4">
                    <!-- KPI List diisi via JS -->
                </div>
            </section>
        </div>

        <!-- QUICK NAV -->
        <h2 class="text-lg font-black text-gray-800 px-2 mt-8">Navigasi Utama</h2>
        <div class="grid grid-cols-3 gap-4 mb-10">
            <button onclick="window.location.href='financial.html'" class="menu-btn apple-card p-4 flex flex-col items-center justify-center border border-gray-100 bg-[#FF6B00] text-white">
                <span class="text-2xl mb-1">📊</span>
                <span class="font-bold text-xs">Financial Hub</span>
            </button>
            <button onclick="window.location.href='logs.html'" class="menu-btn apple-card p-4 flex flex-col items-center justify-center border border-gray-100 text-gray-800">
                <span class="text-2xl mb-1">🎮</span>
                <span class="font-bold text-xs">Logs Unit</span>
            </button>
            <button onclick="window.location.href='input.html'" class="menu-btn apple-card p-4 flex flex-col items-center justify-center border border-gray-100 text-gray-800">
                <span class="text-2xl mb-1">📝</span>
                <span class="font-bold text-xs">Input Trx</span>
            </button>
        </div>

    </main>

    <script>
        const CONFIG = { WEBHOOK_URL: "https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/86cee1b8-b00d-4aa6-8ff4-23735dc9afe1" };
        const STATE = { logs: [] };

        const APP = {
            init: () => {
                const now = new Date();
                document.getElementById('date-text').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
                APP.loadDashboard();
            },
            logout: () => { localStorage.removeItem('arena_session_v6'); window.location.href = 'index.html'; },
            formatRp: (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n || 0),
            formatDateNice: (dStr) => {
                if(!dStr) return '-';
                const d = new Date(dStr);
                if(isNaN(d)) return dStr;
                return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
            },
            
            api: async (p) => {
                try {
                    const r = await fetch(CONFIG.WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: p.action, data: p }) });
                    const txt = await r.text(); return txt ? JSON.parse(txt) : [];
                } catch (e) { return []; }
            },

            loadDashboard: async () => {
                document.getElementById('loader').classList.remove('hidden');
                const res = await APP.api({ action: 'get_dashboard', role: 'manager', branch: 'ALL' });
                document.getElementById('loader').classList.add('hidden');

                STATE.logs = Array.isArray(res) ? res.map(i => i.json || i) : [];
                APP.processInsights();
            },

            processInsights: () => {
                const now = new Date();
                // Get timezone offset handled date string for month comparison
                const tzOffset = now.getTimezoneOffset() * 60000; 
                const localISOTime = (new Date(Date.now() - tzOffset)).toISOString();
                const monthStr = localISOTime.substring(0,7);
                
                let totalValid = 0;
                let totalRevenue = 0;
                let totalBatal = 0;
                let totalAll = 0;
                
                let kpis = {};
                let dailyCount = {};
                let branchCount = { 'Banda': 0, 'Sabang': 0, 'Aceh Timur': 0 };

                STATE.logs.forEach(l => {
                    const dateStrFull = l.jam_mulai_sewa || l.createdAt || '';
                    if (!dateStrFull.startsWith(monthStr)) return;

                    const dateStr = dateStrFull.substring(0,10);
                    const status = String(l.status_unit_arena).toLowerCase();
                    const admin = String(l.admin_name || l.Users || 'Sistem').toUpperCase();
                    const branch = l.cabang_arena === 'Banda Aceh' ? 'Banda' : (l.cabang_arena === 'Atim' ? 'Aceh Timur' : l.cabang_arena);
                    const revenue = (Number(l.tagihan_arena) || 0) + (Number(l.ongkir || l.ongkir_arena) || 0);

                    totalAll++;

                    if (status === 'batal') {
                        totalBatal++;
                    } else if (!['pending', 'maintenance'].includes(status)) {
                        totalValid++;
                        totalRevenue += revenue;
                        
                        kpis[admin] = (kpis[admin] || 0) + 1;
                        dailyCount[dateStr] = (dailyCount[dateStr] || 0) + 1;
                        if(branchCount[branch] !== undefined) branchCount[branch]++;
                    }
                });

                // 1. Manager Target (150)
                const mgrTarget = 150;
                const mgrPercent = Math.min(Math.round((totalValid / mgrTarget) * 100), 100);
                document.getElementById('mgr-current').innerText = totalValid;
                document.getElementById('mgr-percent').innerText = `${mgrPercent}%`;
                document.getElementById('mgr-progress').style.width = `${mgrPercent}%`;
                
                let mgrStatusTxt = `Membutuhkan ${Math.max(mgrTarget - totalValid, 0)} trx lagi untuk capai target.`;
                if (totalValid >= mgrTarget) mgrStatusTxt = "🎉 Luar biasa! Target manajer bulan ini telah tercapai.";
                document.getElementById('mgr-status-text').innerText = mgrStatusTxt;

                // 2. Daily Average
                const currentDay = now.getDate();
                const dailyAvg = totalValid > 0 ? (totalValid / currentDay).toFixed(1) : 0;
                document.getElementById('insight-daily').innerHTML = `${dailyAvg} <span class="text-xs font-bold text-gray-500">trx/hari</span>`;

                // 3. Highest Day
                let maxDay = ''; let maxDayCount = 0;
                for (const [day, count] of Object.entries(dailyCount)) {
                    if (count > maxDayCount) { maxDayCount = count; maxDay = day; }
                }
                document.getElementById('insight-maxday').innerText = APP.formatDateNice(maxDay);
                document.getElementById('insight-maxcount').innerText = `${maxDayCount} transaksi`;

                // 4. Avg Value
                const avgValue = totalValid > 0 ? (totalRevenue / totalValid) : 0;
                document.getElementById('insight-avgval').innerText = APP.formatRp(avgValue);

                // 5. Cancel Rate
                const cancelRate = totalAll > 0 ? ((totalBatal / totalAll) * 100).toFixed(1) : 0;
                document.getElementById('insight-cancel').innerText = `${cancelRate}%`;

                // 6. Branch Distribution
                const branchContainer = document.getElementById('branch-dist');
                const branchColors = { 'Banda': 'bg-blue-500', 'Sabang': 'bg-teal-500', 'Aceh Timur': 'bg-orange-500' };
                let branchHtml = '';
                
                for (const [bName, bCount] of Object.entries(branchCount)) {
                    let pct = totalValid > 0 ? Math.round((bCount / totalValid) * 100) : 0;
                    branchHtml += `
                        <div>
                            <div class="flex justify-between text-xs font-bold mb-1">
                                <span class="text-gray-700">${bName === 'Banda' ? 'Banda Aceh' : bName}</span>
                                <span class="text-gray-900">${bCount} trx <span class="text-gray-400 ml-1">(${pct}%)</span></span>
                            </div>
                            <div class="w-full bg-gray-100 rounded-full h-2.5 overflow-hidden">
                                <div class="${branchColors[bName]} h-full rounded-full" style="width: ${pct}%"></div>
                            </div>
                        </div>`;
                }
                branchContainer.innerHTML = branchHtml || '<p class="text-xs text-gray-400">Tidak ada data.</p>';

                // 7. KPI Admin List
                const kpiContainer = document.getElementById('kpi-list');
                const sortedKpis = Object.entries(kpis).sort((a, b) => b[1] - a[1]);
                
                const medals = ['🥇', '🥈', '🥉'];

                if (sortedKpis.length === 0) {
                    kpiContainer.innerHTML = '<p class="text-center text-sm text-gray-400 py-4 border-2 border-dashed border-gray-200 rounded-xl">Belum ada data admin.</p>';
                } else {
                    kpiContainer.innerHTML = sortedKpis.map(([name, count], index) => {
                        let rankIcon = index < 3 ? `<span class="text-xl">${medals[index]}</span>` : `<span class="w-6 text-center text-xs font-bold text-gray-400">#${index+1}</span>`;
                        let barPct = Math.min((count / sortedKpis[0][1]) * 100, 100); // Relatif terhadap top 1
                        
                        return `
                        <div class="flex items-center gap-3">
                            ${rankIcon}
                            <div class="flex-grow">
                                <div class="flex justify-between items-end mb-1">
                                    <span class="font-bold text-xs text-gray-800">${name}</span>
                                    <span class="font-black text-sm">${count} <span class="text-[10px] font-bold text-gray-400">trx</span></span>
                                </div>
                                <div class="w-full bg-gray-100 rounded-full h-1.5 overflow-hidden">
                                    <div class="bg-gradient-to-r from-gray-800 to-black h-full rounded-full" style="width: ${barPct}%"></div>
                                </div>
                            </div>
                        </div>`;
                    }).join('');
                }
            }
        };

        window.onload = APP.init;
    </script>
</body>
</html>
