<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARENA SYSTEM - Dashboard Manager</title>
    <link rel="icon" href="https://raw.githubusercontent.com/sunsetdansenja-arch/bot-arrena-assets/main/logo%20arena%20gaming.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --mario-orange: #FF6B00; --mario-black: #000000; --mario-yellow: #FFD700; }
        body { font-family: 'Fredoka', sans-serif; background-color: var(--mario-orange); color: var(--mario-black); background-image: radial-gradient(rgba(0,0,0,0.05) 2px, transparent 2px); background-size: 20px 20px; }
        .mario-card { background-color: white; border: 4px solid var(--mario-black); border-radius: 16px; box-shadow: 6px 6px 0px 0px var(--mario-black); }
        .mario-btn { background-color: white; border: 4px solid var(--mario-black); border-radius: 12px; box-shadow: 4px 4px 0px 0px var(--mario-black); transition: all 0.1s ease-in-out; font-weight: 700; text-align: center; cursor: pointer; }
        .mario-btn:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px 0px var(--mario-black); }
        #loader { position: fixed; inset: 0; background: rgba(255,107,0,0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .spinner { width: 50px; height: 50px; border: 6px solid var(--mario-black); border-top-color: var(--mario-yellow); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }
        .custom-scroll::-webkit-scrollbar { height: 4px; width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 4px; }
    </style>
</head>
<body class="pb-10">
    <script>
        const session = JSON.parse(localStorage.getItem('arena_session_v6'));
        if (!session || session.role !== 'manager') window.location.href = 'index.html';
    </script>
    <div id="loader"><div class="spinner mb-4"></div><h2 class="text-xl font-black text-white">SINKRONISASI DATA...</h2></div>
    
    <header class="w-full bg-black p-4 sticky top-0 z-40 border-b-4 border-yellow-400 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <div class="bg-yellow-400 p-1.5 rounded-lg border-2 border-white"><img src="https://raw.githubusercontent.com/sunsetdansenja-arch/bot-arrena-assets/main/logo%20arena%20gaming.png" class="h-8 w-8 object-contain"></div>
            <div>
                <h1 class="text-lg font-black text-white leading-none">ARENA MANAGER</h1>
                <p id="user-info-text" class="text-[9px] font-bold text-yellow-400 uppercase tracking-widest mt-1">SINKRONISASI...</p>
            </div>
        </div>
        <nav class="flex flex-wrap justify-center gap-2 w-full md:w-auto">
            <button onclick="window.location.href='logs.html'" class="mario-btn bg-white text-black px-3 py-2 text-xs">🎮 LOGS</button>
            <button onclick="window.location.href='input.html'" class="mario-btn bg-white text-black px-3 py-2 text-xs">📝 INPUT</button>
            <button onclick="window.location.href='expense.html'" class="mario-btn bg-white text-black px-3 py-2 text-xs">💸 BIAYA</button>
            <button onclick="window.location.href='report.html'" class="mario-btn bg-white text-black px-3 py-2 text-xs">📊 REPORT</button>
            <button onclick="APP.logout()" class="mario-btn bg-red-500 text-white px-3 py-2 text-xs">🚪 LOGOUT</button>
        </nav>
    </header>

    <main class="w-full max-w-7xl mx-auto p-4 md:p-6 mt-2">
        <div id="main-content" class="w-full mx-auto space-y-6"></div>
    </main>

    <script>
        const CONFIG = { WEBHOOK_URL: "https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/86cee1b8-b00d-4aa6-8ff4-23735dc9afe1" };
        const STATE = { user: session, logs: [], expenses: [] };
        
        const APP = {
            init: () => {
                document.getElementById('user-info-text').innerText = `${STATE.user.username.toUpperCase()} | DASHBOARD`;
                APP.loadDashboard();
            },
            logout: () => { localStorage.removeItem('arena_session_v6'); window.location.href = 'index.html'; },
            formatRp: (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(n || 0),
            getNowStr: () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().replace('T', ' ').substring(0,19); },
            getTodayStr: () => APP.getNowStr().substring(0,10),
            getYesterdayStr: () => { const d = new Date(); d.setDate(d.getDate()-1); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().split('T')[0]; },
            getMonthStr: () => APP.getNowStr().substring(0,7),
            api: async (p) => {
                try { const r = await fetch(CONFIG.WEBHOOK_URL, { method: 'POST', body: JSON.stringify({ action: p.action, data: p }) }); const txt = await r.text(); return txt ? JSON.parse(txt) : []; } catch (e) { return null; }
            },
            loadDashboard: async () => {
                const res = await APP.api({ action: 'get_dashboard', role: 'admin', branch: 'ALL' });
                document.getElementById('loader').classList.add('hidden');
                let raw = Array.isArray(res) ? res.map(i => i.json || i) : [];
                STATE.logs = raw.filter(i => i.tagihan_arena !== undefined);
                STATE.expenses = raw.filter(i => i.pengeluaran_arena !== undefined);
                document.getElementById('main-content').innerHTML = APP.renderOmsetTab();
            },
            renderOmsetTab: () => {
                const todayStr = APP.getTodayStr(); const yestStr = APP.getYesterdayStr(); const monthStr = APP.getMonthStr();
                let data = { ALL: { t: 0, y: 0, m: 0 }, 'Sabang': { t: 0, y: 0, m: 0 }, 'Banda': { t: 0, y: 0, m: 0 }, 'Aceh Timur': { t: 0, y: 0, m: 0 } };
                
                [...STATE.logs].reverse().forEach(l => {
                    const stat = String(l.status_unit_arena).toLowerCase();
                    const val = Number(l.tagihan_arena) || 0;
                    let safeDate = l.jam_mulai_sewa ? String(l.jam_mulai_sewa) : (l.createdAt ? String(l.createdAt) : '');
                    const dateStr = safeDate.substring(0,10); const mStr = safeDate.substring(0,7);
                    const branch = l.cabang_arena === 'Banda Aceh' ? 'Banda' : (l.cabang_arena === 'Atim' ? 'Aceh Timur' : l.cabang_arena);
                    
                    if (mStr === monthStr && !['batal', 'pending', 'maintenance'].includes(stat)) {
                        data.ALL.m += val; if (data[branch]) data[branch].m += val;
                        if (dateStr === todayStr) { data.ALL.t += val; if (data[branch]) data[branch].t += val; }
                        if (dateStr === yestStr) { data.ALL.y += val; if (data[branch]) data[branch].y += val; }
                    }
                });

                return `
                <div class="mario-card p-4 md:p-8 max-w-5xl mx-auto">
                    <h2 class="font-black text-center border-b-2 border-black pb-2 mb-4 uppercase">Monitoring Omset</h2>
                    <div class="bg-black text-white p-4 rounded-xl border-4 border-yellow-400 mb-6 shadow-[4px_4px_0px_#000]">
                        <p class="text-[10px] font-bold text-gray-300 text-center">TOTAL KESELURUHAN (BULAN INI)</p>
                        <p class="text-3xl font-black text-yellow-400 text-center">${APP.formatRp(data.ALL.m)}</p>
                        <div class="flex justify-between mt-3 pt-3 border-t-2 border-gray-700">
                            <div><p class="text-[9px] text-gray-400">HARI INI</p><p class="font-black text-green-400">${APP.formatRp(data.ALL.t)}</p></div>
                            <div class="text-right"><p class="text-[9px] text-gray-400">KEMARIN</p><p class="font-black text-[#FF6B00]">${APP.formatRp(data.ALL.y)}</p></div>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        ${['Banda', 'Sabang', 'Aceh Timur'].map(b => `
                        <div class="border-2 border-black p-3 rounded-lg shadow-[2px_2px_0px_#000] bg-white text-center">
                            <p class="font-black text-sm border-b-2 border-dashed border-gray-300 pb-1">${b === 'Banda' ? 'BANDA ACEH' : b.toUpperCase()}</p>
                            <p class="text-xs font-black text-[#FF6B00] mt-2">${APP.formatRp(data[b].m)}</p>
                            <p class="text-[9px] font-bold text-gray-500">BULAN INI</p>
                        </div>`).join('')}
                    </div>
                </div>`;
            }
        };
        window.onload = APP.init;
    </script>
</body>
</html>
