<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARENA SYSTEM - Manager Dashboard</title>
    
    <link class="apple-touch-icon" href="https://raw.githubusercontent.com/sunsetdansenja-arch/bot-arrena-assets/main/logo%20arena%20gaming.png">
    <link rel="icon" href="https://raw.githubusercontent.com/sunsetdansenja-arch/bot-arrena-assets/main/logo%20arena%20gaming.png" type="image/png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --mario-orange: #FF6B00; --mario-black: #000000; --mario-yellow: #FFD700; }
        body { font-family: 'Fredoka', sans-serif; background-color: var(--mario-orange); color: var(--mario-black); -webkit-font-smoothing: antialiased; background-image: radial-gradient(rgba(0,0,0,0.05) 2px, transparent 2px); background-size: 20px 20px; }
        .mario-card { background-color: white; border: 4px solid var(--mario-black); border-radius: 16px; box-shadow: 6px 6px 0px 0px var(--mario-black); }
        .mario-btn { background-color: white; border: 4px solid var(--mario-black); border-radius: 12px; box-shadow: 4px 4px 0px 0px var(--mario-black); transition: all 0.1s ease-in-out; font-weight: 700; text-align: center; cursor: pointer; text-decoration: none; }
        .mario-btn:active:not(:disabled) { transform: translate(4px, 4px); box-shadow: 0px 0px 0px 0px var(--mario-black); }
        .mario-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .mario-input { width: 100%; background-color: #F3F4F6; border: 3px solid var(--mario-black); border-radius: 8px; padding: 10px; font-weight: 600; outline: none; }
        .mario-input:focus { border-color: var(--mario-orange); background-color: white; }
        
        /* Navigasi PC */
        #pc-nav { display: none; }
        @media (min-width: 768px) {
            #pc-nav { display: flex !important; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
            .bottom-nav-container { display: none !important; }
            body { padding-bottom: 0 !important; } 
            .header-container { flex-direction: column; align-items: stretch; }
            .header-top-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        }

        #loader { position: fixed; inset: 0; background: rgba(255,107,0,0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .spinner { width: 50px; height: 50px; border: 6px solid var(--mario-black); border-top-color: var(--mario-yellow); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }
        .animate-pop { animation: popIn 0.3s forwards; }
        @keyframes popIn { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        /* Custom Scrollbar Mobile Nav */
        .custom-scroll::-webkit-scrollbar { height: 4px; width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 4px; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 999; display: flex; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(4px); }
        .font-beuna { font-family: 'Inter', sans-serif; }

        @media print { 
            body * { visibility: hidden; } 
            body { background: white; margin: 0; padding: 0; }
            #print-area, #print-area * { visibility: visible; } 
            #print-area { position: absolute; top: 0; left: 0; width: 100%; }
            @page { size: A4; margin: 15mm; }
            table { page-break-inside: auto; width: 100%; border-collapse: collapse; }
            tr { page-break-inside: avoid; page-break-after: auto; }
            thead { display: table-header-group; }
            .page-break { page-break-before: always; margin-top: 20px; }
        }
    </style>
</head>
<body class="pb-24 md:pb-0">

    <script>
        const session = JSON.parse(localStorage.getItem('arena_session_v6'));
        if (!session || session.role !== 'manager') { 
            window.location.href = 'index.html'; 
        }
    </script>

    <div id="loader">
        <div class="spinner mb-4"></div>
        <h2 id="loader-text" class="text-xl font-black text-white">MEMUAT SISTEM...</h2>
    </div>

    <header class="w-full bg-black p-4 sticky top-0 z-40 border-b-4 border-yellow-400">
        <div class="max-w-7xl mx-auto header-container">
            <div class="header-top-row flex justify-between items-center gap-4">

                    <div class="bg-yellow-400 p-1.5 rounded-lg border-2 border-white shadow-[2px_2px_0px_#000]">

                    </div>

                <button onclick="APP.switchTab('expense')" id="pc-tab-expense" class="mario-btn bg-white text-black px-3 py-2 text-[10px] md:text-xs font-black border-2 border-black">💸 BIAYA</button>

            <div onclick="APP.switchTab('input')" id="mob-tab-input" style="min-width: 50px; text-align: center; cursor: pointer; color: gray; font-weight: bold; font-size: 10px;">

            <div onclick="APP.switchTab('omset')" id="mob-tab-omset" style="min-width: 50px; text-align: center; cursor: pointer; color: gray; font-weight: bold; font-size: 10px;">

            </div>
            <div onclick="APP.switchTab('expense')" id="mob-tab-expense" style="min-width: 50px; text-align: center; cursor: pointer; color: gray; font-weight: bold; font-size: 10px;">
                <span class="text-xl block mb-1">💸</span>BIAYA
            </div>
            <div onclick="APP.switchTab('report')" id="mob-tab-report" style="min-width: 50px; text-align: center; cursor: pointer; color: gray; font-weight: bold; font-size: 10px;">

    <div id="modal-acc" class="modal-overlay hidden">

            <h2 class="text-xl font-black mb-4 border-b-2 border-black pb-2 text-green-600 uppercase">Pilih Unit ✅</h2>

    <div id="modal-cancel" class="modal-overlay hidden">

            <h2 class="text-xl font-black mb-4 text-center border-b-2 border-black pb-2 text-red-600 uppercase">Batalkan Pesanan ❌</h2>
            <div class="space-y-3">
                <label class="text-xs font-bold block">Pilih Alasan Batal:</label>
                <select id="cancel-reason" class="mario-input p-2 text-sm" onchange="APP.toggleCancelOther()">
                    <option value="Telat Respon">Telat Respon (Customer Hilang)</option>
                    <option value="Unit Full">Unit Full / Habis</option>
                    <option value="Request Customer">Permintaan Customer (Ganti Jadwal dll)</option>

                <div class="flex gap-2 mt-4">
                    <button onclick="APP.closeModal('modal-cancel')" class="mario-btn bg-gray-200 text-gray-700 p-3 flex-1 text-sm border-gray-400">Kembali</button>
                    <button onclick="APP.confirmCancel()" class="mario-btn bg-red-600 text-white p-3 flex-1 text-sm border-red-800">Batalkan</button>

        </div>

    <div id="print-area" class="hidden"></div>

    <script>
        const CONFIG = {
            WEBHOOK_URL: "https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/86cee1b8-b00d-4aa6-8ff4-23735dc9afe1", 
            PRICING: {
                Paket: [ 
                    { name: "Malam", price: 50000 }, 
                    { name: "Pagi", price: 45000 }, 
                    { name: "Sore", price: 45000 }, 
                    { name: "Sultan 24H", price: 115000 } 
                ],
                Regular: [ 
                    { name: "3 Jam", price: 30000 }, 
                    { name: "4 Jam", price: 40000 }, 
                    { name: "5 Jam", price: 50000 } 
                ]
            },
            UNITS: [ 
                { id: 1, label: 'SABANG' }, { id: 2, label: 'SABANG' }, 
                { id: 3, label: 'BANDA' }, { id: 4, label: 'BANDA' }, { id: 5, label: 'BANDA' }, 
                { id: 8, label: 'ATIM' }, { id: 9, label: 'ATIM' } 
            ]
        };

        const STATE = { 
            user: session, 
            logs: [], 
            expenses: [], 
            activeTab: 'logs',
            lastFinalPrice: 0,
            activeModalRowId: null, 
            activeModalStat: null, 
            activeModalUnit: null, 
            activeModalPay: null,
            activeAccId: null, 
            activeAccPay: null
        };

        const APP = {
            init: () => {
                document.getElementById('user-info-text').innerText = `${STATE.user.username.toUpperCase()} | SYSTEM MANAGER`;
                APP.loadDashboard();
            },

            showLoader: (t) => { document.getElementById('loader-text').innerText = t; document.getElementById('loader').classList.remove('hidden'); },
            hideLoader: () => { document.getElementById('loader').classList.add('hidden'); },
            formatRp: (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(n || 0),
            getNowStr: () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().replace('T', ' ').substring(0,19); },
            getTodayStr: () => APP.getNowStr().substring(0,10),
            getYesterdayStr: () => { const d = new Date(); d.setDate(d.getDate()-1); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().split('T')[0]; },
            getMonthStr: () => APP.getNowStr().substring(0,7),
            
            generateMonthOptions: () => {
                const names = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
                let opts = ''; 
                for(let i=0; i<12; i++) { 
                    let d = new Date(); 
                    d.setDate(1); 
                    d.setMonth(d.getMonth() - i); 
                    opts += `<option value="${d.toISOString().substring(0,7)}">${names[d.getMonth()]} ${d.getFullYear()}</option>`; 
                }
                return opts;
            },

            logout: () => { localStorage.removeItem('arena_session_v6'); window.location.href = 'index.html'; },

            api: async (p) => {
                try {
                    const r = await fetch(CONFIG.WEBHOOK_URL, { 
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: p.action, data: p }) 
                    });
                    const txt = await r.text(); return txt ? JSON.parse(txt) : [];
                } catch (e) { return null; }
            },

            loadDashboard: async () => {
                APP.showLoader('SINKRONISASI DATA...');
                const res = await APP.api({ action: 'get_dashboard', role: 'admin', branch: 'ALL' });
                APP.hideLoader();

                let raw = Array.isArray(res) ? res.map((i, idx) => {
                    let d = i.json || i; 
                    if (i.id !== undefined && d.id === undefined) d.id = i.id; 
                    d._dbIndex = idx; return d;
                }) : [];

                STATE.logs = raw.filter(i => i.tagihan_arena !== undefined);
                STATE.expenses = raw.filter(i => i.pengeluaran_arena !== undefined);
                APP.switchTab(STATE.activeTab);
            },

            switchTab: (tab) => {
                STATE.activeTab = tab;
                
                document.querySelectorAll('#pc-nav button').forEach(b => { 
                    if(b.id !== 'pc-tab-manager') { 
                        b.classList.remove('bg-black', 'text-white');
                        b.classList.add('bg-white', 'text-black'); 
                    }
                });
                
                document.querySelectorAll('.bottom-nav-container nav div').forEach(div => {
                    if(!div.onclick.toString().includes('wamirror') && !div.onclick.toString().includes('god.html')) {
                        div.style.color = 'gray';
                        div.style.textShadow = 'none';
                    }
                });
                
                if(document.getElementById(`pc-tab-${tab}`)) {
                    let b = document.getElementById(`pc-tab-${tab}`);
                    b.classList.remove('bg-white', 'text-black');
                    b.classList.add('bg-black', 'text-white');
                }
                if(document.getElementById(`mob-tab-${tab}`)) {
                    let mBtn = document.getElementById(`mob-tab-${tab}`);
                    mBtn.style.color = 'var(--mario-orange)';
                    mBtn.style.textShadow = '1px 1px 0px black';
                }

                const container = document.getElementById('main-content');
                
                if (tab === 'logs') { container.innerHTML = APP.renderLogsUI(); } 
                else if (tab === 'input') { container.innerHTML = APP.renderInputForm(); APP.updateUnitOptions(); APP.updatePrice(); } 
                else if (tab === 'omset') { container.innerHTML = APP.renderOmsetTab(); } 
                else if (tab === 'expense') { container.innerHTML = APP.renderExpenseForm(); } 
                // Fix: Pemanggilan fungsi Report yang sebelumnya error sudah aman
                else if (tab === 'report') { container.innerHTML = APP.renderReportTab(); APP.updateReportPreview(); }
            },

            // =====================================
            // MISSING FUNCTION FIX: FINANCIAL CALCULATOR
            // =====================================
            calculateFinancials: (monthStr) => {
                let fin = {
                    ALL: { gross: 0, expense: 0, net: 0, booking_mandiri: 0, booking_manual: 0, order_logs: [], exp_logs: [], dimas_total: 0, dp_total: 0 },
                    'Banda': { gross: 0, expense: 0, net: 0, booking_mandiri: 0, booking_manual: 0, order_logs: [], exp_logs: [], sh_pct: 0.4, sh_cut: 0, dp_fee: 0, dp_comm: 0 },
                    'Sabang': { gross: 0, expense: 0, net: 0, booking_mandiri: 0, booking_manual: 0, order_logs: [], exp_logs: [], sh_pct: 0.5, sh_cut: 0, dp_fee: 0, dp_comm: 0 },
                    'Aceh Timur': { gross: 0, expense: 0, net: 0, booking_mandiri: 0, booking_manual: 0, order_logs: [], exp_logs: [], sh_pct: 0.5, sh_cut: 0, dp_fee: 0, dp_comm: 0 }
                };

                // 1. Rekap Pemasukan
                STATE.logs.forEach(l => {
                    let stat = String(l.status_unit_arena).toLowerCase();
                    if (['batal', 'pending', 'maintenance'].includes(stat)) return;

                    let safeDate = l.jam_mulai_sewa ? String(l.jam_mulai_sewa) : (l.createdAt ? String(l.createdAt) : '');
                    if (safeDate.substring(0, 7) !== monthStr) return;

                    let bRaw = l.cabang_arena === 'Banda Aceh' ? 'Banda' : (l.cabang_arena === 'Atim' ? 'Aceh Timur' : l.cabang_arena);
                    let b = fin[bRaw] ? bRaw : 'Banda';

                    let val = (Number(l.tagihan_arena) || 0) + (Number(l.ongkir || l.ongkir_arena) || 0);
                    l.final_val = val;
                    l.proper_branch = b;

                    fin.ALL.gross += val;
                    fin[b].gross += val;

                    let ch = String(l.book_channel || '').toLowerCase();
                    if (ch.includes('web') || ch.includes('auto')) {
                        fin.ALL.booking_mandiri++; fin[b].booking_mandiri++;
                    } else {
                        fin.ALL.booking_manual++; fin[b].booking_manual++;
                    }

                    fin.ALL.order_logs.push(l);
                    fin[b].order_logs.push(l);
                });

                // 2. Rekap Pengeluaran
                STATE.expenses.forEach(e => {
                    let d = (e.tanggal_pengeluaran_arena || e.tanggal_pengeluaran || '');
                    if (d.substring(0, 7) !== monthStr) return;

                    let bRaw = e.cabang_id_arena || e.cabang;
                    let b = fin[bRaw] ? bRaw : 'Banda';
                    let val = Number(e.jumlah_pengeluaran_arena || e.jumlah_pengeluaran) || 0;

                    e.proper_branch = b;
                    fin.ALL.expense += val;
                    fin[b].expense += val;

                    fin.ALL.exp_logs.push(e);
                    fin[b].exp_logs.push(e);
                });

                // 3. Kalkulasi Net & Shareholder
                ['Banda', 'Sabang', 'Aceh Timur'].forEach(b => {
                    // Set default DP = 0, kecuali n8n memilik logistik terpisah
                    fin[b].dp_fee = 0; fin[b].dp_comm = 0;
                    let dpAmount = fin[b].dp_fee + fin[b].dp_comm;
                    fin.ALL.dp_total += dpAmount;

                    fin[b].net = fin[b].gross - fin[b].expense - dpAmount;
                    fin[b].sh_cut = fin[b].net > 0 ? fin[b].net * fin[b].sh_pct : 0;
                    fin.ALL.net += fin[b].net;
                });

                fin.ALL.dimas_total = fin.ALL.net - (fin['Banda'].sh_cut + fin['Sabang'].sh_cut + fin['Aceh Timur'].sh_cut);

                return fin;
            },

            // =====================================
            // MISSING FUNCTION FIX: RENDER REPORT TAB
            // =====================================
            renderReportTab: () => {
                return `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-6xl mx-auto">
                    <div class="mario-card p-5 animate-pop mb-6 md:mb-0 h-fit lg:col-span-1">
                        <h2 class="font-black text-center border-b-2 border-black pb-2 mb-4 text-lg uppercase">Menu Laporan</h2>
                        <div class="space-y-4">
                            <div>
                                <label class="text-xs font-bold uppercase">Pilih Bulan</label>
                                <select id="report-month" onchange="APP.updateReportPreview()" class="mario-input p-3 mt-1">
                                    ${APP.generateMonthOptions()}
                                </select>
                            </div>
                            <div>
                                <label class="text-xs font-bold uppercase">Jenis Dokumen</label>
                                <select id="report-type" onchange="APP.updateReportPreview()" class="mario-input p-3 mt-1 font-bold text-blue-700">
                                    <option value="ALL">Laporan Global (Semua Cabang)</option>
                                    <option value="Banda">Laporan Cabang Banda Aceh</option>
                                    <option value="Sabang">Laporan Cabang Sabang</option>
                                    <option value="Aceh Timur">Laporan Cabang Aceh Timur</option>

                logs.sort((a,b) => new Date(String(b.jam_mulai_sewa || b.createdAt).replace(' ','T')) - new Date(String(a.jam_mulai_sewa || a.createdAt).replace(' ','T')));
                return logs.length > 0 ? String(logs[0].status_unit_arena).toLowerCase() : 'kosong';
            },

            getUnitStatus: (uNum) => {
                const stat = APP.getUnitStatusRaw(uNum);
                if (['playing', 'main'].includes(stat)) return 'main';
                if (['booked', 'book', 'pending'].includes(stat)) return 'book';
                if (stat === 'maintenance') return 'maintenance';
                return 'kosong';
            },

                    let label = `Unit ${u.id}`;
                    if (['playing','main','booked','pending'].includes(stat)) label += ' 🔴 (Terisi)';
                    else label += ' 🟢 (Kosong)';
                    return `<option value="${u.id}">${label}</option>`;

                const mStr = APP.getMonthStr();

                    const s = String(l.status_unit_arena).toLowerCase();

                    });
                    groupedHtml += '</div>';
                    return groupedHtml || '<p class="text-center font-bold text-gray-500">Tidak ada log di bulan ini.</p>';
                } else {
                    return `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2">${filtered.reverse().map(l => APP.renderSingleLogCard(l)).join('')}</div>` || '<p class="text-center font-bold text-gray-500">Tidak ada log di bulan ini.</p>';
                }
            },

            renderSingleLogCard: (l) => {
                const rId = l.id || l.row_number || l._rowIndex || '';
                const uLabel = String(l.unit_arena).toLowerCase().includes('unit') ? l.unit_arena : 'Unit ' + l.unit_arena;
                const cLabel = l.cabang_arena === 'Banda' ? 'Banda Aceh' : l.cabang_arena;
                
                let safeDate = l.jam_mulai_sewa ? String(l.jam_mulai_sewa) : (l.createdAt ? String(l.createdAt) : '');
                let dStr = ''; 
                if (safeDate) { const dObj = new Date(safeDate.replace(' ', 'T')); if (!isNaN(dObj)) dStr = ['MINGGU','SENIN','SELASA','RABU','KAMIS','JUMAT','SABTU'][dObj.getDay()]; }
                
                const stat = String(l.status_unit_arena).toLowerCase(); 
                const pay = l.pembayaran || 'Belum';
                const wLink = l.link_wa_pelanggan_arena || 'https://wa.me/' + String(l.nomor_pelanggan_arena).replace(/^0/, '62');
                
                let cardClass = "border-2 border-black p-3 rounded-xl bg-white shadow-[2px_2px_0px_#000] relative w-full h-full flex flex-col";
                let badgeHtml = ""; let txtClass = "";
                let payClass = 'bg-red-400 text-white'; let payTxt = '❌ BELUM';
                
                if (pay === 'Lunas Cash') { payClass = 'bg-green-400 text-black'; payTxt = '💵 CASH'; }
                else if (pay === 'Lunas Transfer') { payClass = 'bg-blue-500 text-white'; payTxt = '📱 TF'; }
                else if (pay === 'Lunas' || pay === 'lunas') { payClass = 'bg-green-400 text-black'; payTxt = '✅ LUNAS'; }

                if (stat === 'batal') { 
                    cardClass = "border-2 border-gray-400 p-3 rounded-xl bg-gray-200 opacity-75 relative flex flex-col"; txtClass = "line-through text-gray-500"; badgeHtml = `<div class="bg-red-600 text-white text-[9px] font-black px-2 py-1 absolute top-0 right-0 rounded-bl-lg rounded-tr-lg shadow-md z-10">❌ BATAL</div>`; 
                } else if (stat === 'booked' || stat === 'book') { 
                    cardClass = "border-2 border-[#FF6B00] p-3 rounded-xl bg-orange-50 shadow-[2px_2px_0px_#ea580c] relative flex flex-col"; 
                } else if (stat === 'playing' || stat === 'main') { 
                    cardClass = "border-2 border-red-500 p-3 rounded-xl bg-red-50 shadow-[2px_2px_0px_#ef4444] relative flex flex-col"; badgeHtml = `<span class="absolute top-3 right-3 flex h-3 w-3"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span></span>`; 
                } else if (stat === 'finished' || stat === 'selesai') { 
                    if (pay === 'Belum' || !pay) { cardClass = "border-4 border-red-600 p-3 rounded-xl bg-red-50 shadow-[2px_2px_0px_#dc2626] relative flex flex-col"; badgeHtml = `<div class="bg-red-600 text-white text-[9px] font-black px-2 py-1 absolute top-0 right-0 rounded-bl-lg rounded-tr-lg animate-pulse shadow-md">⚠️ BELUM BAYAR</div>`; } 
                    else { cardClass = "border-2 border-gray-400 p-3 rounded-xl bg-gray-100 shadow-[2px_2px_0px_gray] relative flex flex-col"; } 
                }

                const oVal = l.ongkir || l.ongkir_arena || 0;
                const oLbl = Number(oVal) > 0 ? `<span class="text-[9px] font-bold text-blue-600 bg-blue-100 px-1 border border-blue-300 rounded ml-1">+ Ongkir ${APP.formatRp(oVal)}</span>` : '';

                return `
                <div class="${cardClass} mb-2">
                    ${badgeHtml}
                    <div class="flex justify-between items-start mb-2 border-b-2 border-dashed border-gray-300 pb-2">

                            <span class="font-black text-xl text-[#FF6B00] leading-none mb-1 ${txtClass}">${dStr}</span>
                            <span class="font-bold text-[10px] text-gray-500">${safeDate.substring(0,16)}</span>
                        </div>
                        <span class="font-black text-[10px] bg-black text-white px-2 py-1 rounded-md mt-1">${uLabel} (${cLabel})</span>
                    </div>
                    <p class="font-bold text-sm uppercase flex-grow ${txtClass}">${l.nama_pelanggan_arena} <span class="text-[10px] text-gray-500 normal-case ml-1">${l.nomor_pelanggan_arena || ''}</span></p>
                    <div class="flex justify-between items-end mt-2">
                        <div class="flex flex-col">
                            <span class="text-xs font-semibold text-gray-700 ${txtClass}">${l.paket_arena}</span>
                            ${oLbl}
                        </div>
                        <span class="text-sm font-black text-orange-600 ${txtClass}">${APP.formatRp(l.tagihan_arena)}</span>
                    </div>
                    <div class="flex gap-1 mt-3 pt-2 border-t border-gray-200">
                        <select data-old-value="${stat}" onchange="APP.handleStatusChange(this, '${rId}', '${pay}', '${l.unit_arena}')" class="mario-input p-1 text-[9px] w-1/3 font-bold">
                            <option value="booked" ${stat==='booked'?'selected':''}>BOOKED</option>
                            <option value="playing" ${stat==='playing'?'selected':''}>PLAYING</option>
                            <option value="finished" ${stat==='finished'?'selected':''}>FINISHED</option>
                            <option value="batal" ${stat==='batal'?'selected':''}>BATAL ❌</option>
                        </select>
                        <button onclick="APP.handlePaymentClick('${rId}', '${stat}', '${pay}', '${l.unit_arena}')" class="mario-btn p-1 text-[9px] w-1/3 ${payClass}">${payTxt}</button>
                        <a href="${wLink}" target="_blank" class="mario-btn p-1 text-[10px] w-1/3 bg-[#25D366] text-white flex items-center justify-center font-black">💬 WA</a>
                    </div>
                </div>`;
            },

            // =====================================
            // FORM INPUT TRANSAKSI
            // =====================================
            renderInputForm: () => {
                const now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset());

                const maxD = new Date(now); maxD.setDate(maxD.getDate() + 7); 
                const maxDate = maxD.toISOString().slice(0,16);
                const b = STATE.user.branch || ''; 
                
                return `

                                <label class="text-xs font-bold uppercase">Tipe Sewa</label>

                                    <option value="Paket">Paket</option>
                                    <option value="Regular">Regular</option>
                                </select>
                            </div>
                            <div><label class="text-xs font-bold uppercase">Durasi / Amunisi</label><select id="r-prod" onchange="APP.updatePrice()" class="mario-input p-3"></select></div>
                        </div>
                        
                        <div id="logistik-admin-container" class="bg-[#FFE8B3] border-2 border-black p-4 rounded-lg hidden shadow-[2px_2px_0px_#000]">
                            <label class="text-xs font-black uppercase text-center block mb-2">Logistik (Khusus Banda)</label>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <select id="r-delivery" onchange="APP.updatePrice()" class="mario-input p-3 font-bold border-yellow-600">
                                    <option value="ambil">Ambil di Markas</option>
                                    <option value="antar">Antar ke Lokasi</option>
                                </select>
                                <input type="number" id="r-ongkir" placeholder="Ongkir (Rp)" min="0" value="0" onkeyup="APP.updatePrice()" onchange="APP.updatePrice()" class="mario-input p-3 border-blue-500 hidden">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div><label class="text-xs font-bold text-blue-700 uppercase">Jadwal Main</label><input type="datetime-local" id="r-datetime" value="${minDate}" min="${minDate}" max="${maxDate}" onchange="APP.updateUnitOptions()" required class="mario-input p-3 border-blue-500"></div>
                            <div><label class="text-xs font-bold text-red-600 uppercase">Diskon (Rp)</label><input type="number" id="r-diskon" placeholder="0" min="0" onkeyup="APP.updatePrice()" onchange="APP.updatePrice()" class="mario-input p-3 border-red-500"></div>
                        </div>
                        <div>
                            <label class="text-xs font-bold block mb-1 uppercase">Status Pembayaran</label>
                            <select id="r-pay-status" class="mario-input p-3 font-black text-gray-700">
                                <option value="Belum">❌ Belum Bayar</option>
                                <option value="Lunas Cash">💵 Lunas (Cash)</option>
                                <option value="Lunas Transfer">📱 Lunas (Transfer)</option>
                            </select>
                        </div>

                        <div class="bg-black text-yellow-400 p-4 rounded-xl text-center mt-4">
                            <p class="text-xs font-bold text-gray-300 uppercase">Total Tagihan (Inc. Ongkir)</p>
                            <p id="price-tag" class="text-3xl font-black">Rp 0</p>

                        <button type="submit" class="w-full mario-btn bg-yellow-400 p-4 text-lg font-black uppercase">Simpan Transaksi 💾</button>
                    </form>
                </div>`;
            },
            
            updateUnitOptions: () => {
                const b = document.getElementById('r-branch').value; 
                const logistikBox = document.getElementById('logistik-admin-container');
                if(!document.getElementById('r-unit')) return;
                
                if (b === 'Banda') { logistikBox.classList.remove('hidden'); } 
                else { logistikBox.classList.add('hidden'); document.getElementById('r-ongkir').value = 0; document.getElementById('r-delivery').value = 'ambil'; }

                document.getElementById('r-unit').innerHTML = CONFIG.UNITS.filter(u => u.label.includes(b.toUpperCase().substring(0,4))).map(u => {
                    const stat = APP.getUnitStatusRaw(u.id);
                    if (stat === 'maintenance') return '';
                    let label = `Unit ${u.id}`;
                    if (['playing','main','booked','pending'].includes(stat)) label += ' 🔴 (Terisi)';
                    else label += ' 🟢 (Kosong)';
                    return `<option value="${u.id}">${label}</option>`;
                }).join('');
                
                APP.updatePrice();
            },

            updatePrice: () => {
                const t = document.getElementById('r-type').value; 
                const p = document.getElementById('r-prod');
                
                const deliveryMode = document.getElementById('r-delivery') ? document.getElementById('r-delivery').value : 'ambil';
                const ongkirInput = document.getElementById('r-ongkir');
                if (ongkirInput) ongkirInput.classList.toggle('hidden', deliveryMode !== 'antar');
                if (deliveryMode === 'ambil' && ongkirInput) ongkirInput.value = 0;

                if(!p.options.length || document.getElementById('r-type').dataset.last !== t) { 
                    p.innerHTML = CONFIG.PRICING[t].map((x,i) => `<option value="${i}">${x.name}</option>`).join(''); 
                    document.getElementById('r-type').dataset.last = t; 
                }
                
                const basePrice = CONFIG.PRICING[t][p.value].price;
                const diskonVal = Number(document.getElementById('r-diskon') ? document.getElementById('r-diskon').value : 0) || 0;
                const ongkirVal = Number(ongkirInput ? ongkirInput.value : 0) || 0;
                
                let finalCalc = basePrice - diskonVal + ongkirVal; 
                if (finalCalc < 0) finalCalc = 0; 
                
                STATE.lastFinalPrice = finalCalc; 
                document.getElementById('price-tag').innerText = APP.formatRp(finalCalc);
            },

            saveRental: async (e) => {
                e.preventDefault(); 
                APP.showLoader('MENYIMPAN...');
                
                try {
                    const type = document.getElementById('r-type').value; 
                    const prodSel = document.getElementById('r-prod');
                    const rawDate = document.getElementById('r-datetime').value || ''; 
                    const formattedDate = rawDate ? rawDate.replace('T', ' ') + (rawDate.length === 16 ? ':00' : '') : '';
                    
                    const finalName = CONFIG.PRICING[type][prodSel.value].name; 
                    const diskonVal = Number(document.getElementById('r-diskon').value) || 0;
                    let finalPaket = `${finalName} (${type})`; 
                    if (diskonVal > 0) { finalPaket += ` [Diskon ${APP.formatRp(diskonVal)}]`; }

                    await APP.api({ 
                        action: 'input_rental', 
                        name: document.getElementById('r-name').value, 
                        wa: document.getElementById('r-wa').value, 
                        branch: document.getElementById('r-branch').value, 
                        unit: document.getElementById('r-unit').value, 
                        price: STATE.lastFinalPrice, 
                        admin_name: STATE.user.username,

                            <tr><td style="padding:4px 0;">Biaya Sistem & Drop Point</td><td style="text-align:right; color:red;">-${APP.formatRp(dpAmount)}</td></tr>
                            <tr><td colspan="2"><hr style="border-top:1px dashed #ccc; margin:5px 0;"></td></tr>
                            <tr><td style="padding:4px 0; font-weight:bold;">Laba Bersih Keseluruhan</td><td style="text-align:right; font-weight:bold;">${APP.formatRp(bData.net)}</td></tr>
                        </table>
                        <div style="background:#000; color:#fff; padding:15px; text-align:center; border-radius:6px; margin-top:15px;">
                            <p style="margin:0; font-size:11px; color:#ccc; text-transform:uppercase; letter-spacing:1px;">Total Dividen Ditransfer Ke ${shName}</p>
                            <p style="margin:5px 0 0 0; font-size:22px; font-weight:900; color:#4ade80;">${APP.formatRp(shCut)}</p>
                        </div>
                    </div>`;
                    
                    printHtml += `
                    <div style="display:flex; justify-content:space-between; margin-top:20px; margin-bottom: 20px; font-size:12px;">
                        <div style="text-align:center; width:200px;"><p style="margin-bottom:50px;">Disiapkan Oleh,</p><p style="font-weight:bold; border-bottom:1px solid #000; padding-bottom:2px;">${STATE.user.username.toUpperCase()}</p><p style="margin:0;">Arena System Manager</p></div>
                        <div style="text-align:center; width:200px;"><p style="margin-bottom:50px;">Diterima Oleh,</p><p style="font-weight:bold; border-bottom:1px solid #000; padding-bottom:2px;">${shName.toUpperCase()}</p><p style="margin:0;">Shareholder</p></div>
                    </div><div class="page-break"></div>`;

                    let expRows = ''; 
                    bData.exp_logs.forEach(e => { 
                        let bLabel = targetBranch === 'ALL' ? `(${e.proper_branch}) ` : ''; 
                        expRows += `<tr><td style="border:1px solid #ccc; padding:4px;">${e.tanggal_pengeluaran_arena||e.tanggal_pengeluaran||'-'}</td><td style="border:1px solid #ccc; padding:4px;">${bLabel}${e.pengeluaran_arena}</td><td style="border:1px solid #ccc; padding:4px; text-align:right;">${APP.formatRp(e.jumlah_pengeluaran_arena||e.jumlah_pengeluaran)}</td></tr>`; 
                    });
                    printHtml += `<h4 style="margin-bottom:5px; font-size:12px; margin-top:0;">LAMPIRAN 1: Rincian Pengeluaran</h4><table style="width:100%; border-collapse:collapse; font-size:10px; margin-bottom:15px;"><tr style="background:#eee;"><th style="border:1px solid #ccc; padding:4px; text-align:left;">Tanggal</th><th style="border:1px solid #ccc; padding:4px; text-align:left;">Deskripsi</th><th style="border:1px solid #ccc; padding:4px; text-align:right;">Nominal</th></tr>${expRows || '<tr><td colspan="3" style="text-align:center; padding:4px;">Tidak ada pengeluaran manual.</td></tr>'}</table>`;

                    let orderRows = ''; 
                    bData.order_logs.forEach(l => { 
                        let bLabel = targetBranch === 'ALL' ? `(${l.proper_branch}) ` : ''; 
                        let safeDate = l.jam_mulai_sewa ? String(l.jam_mulai_sewa) : (l.createdAt ? String(l.createdAt) : ''); 
                        orderRows += `<tr><td style="border:1px solid #ccc; padding:4px;">${safeDate.substring(0,10)}</td><td style="border:1px solid #ccc; padding:4px;">${bLabel}U${l.unit_arena} - ${l.nama_pelanggan_arena}</td><td style="border:1px solid #ccc; padding:4px;">${l.paket_arena}</td><td style="border:1px solid #ccc; padding:4px; text-align:right;">${APP.formatRp(l.final_val)}</td></tr>`; 
                    });
                    printHtml += `<h4 style="margin-bottom:5px; font-size:12px;">LAMPIRAN 2: Log Transaksi Sukses</h4><table style="width:100%; border-collapse:collapse; font-size:10px; margin-bottom:20px;"><tr style="background:#eee;"><th style="border:1px solid #ccc; padding:4px; text-align:left;">Tanggal</th><th style="border:1px solid #ccc; padding:4px; text-align:left;">Unit & Pelanggan</th><th style="border:1px solid #ccc; padding:4px; text-align:left;">Paket</th><th style="border:1px solid #ccc; padding:4px; text-align:right;">Total Tagihan</th></tr>${orderRows || '<tr><td colspan="4" style="text-align:center; padding:4px;">Tidak ada transaksi.</td></tr>'}</table>`;
                } else {
                    printHtml += `<h2 style="text-align:center; font-size:14px; margin-bottom:20px; font-weight:normal; border-bottom:2px solid #000; padding-bottom:10px;">Periode: <b>${monthLabel}</b> | Cabang: <b>${type === 'ALL' ? 'Semua Cabang (Global)' : type}</b></h2>`;
                    let bData = type === 'ALL' ? fin.ALL : fin[type]; 
                    let dpAmount = type === 'ALL' ? fin.ALL.dp_total : (fin[type].dp_fee + fin[type].dp_comm); 
                    let totalBookings = bData.booking_mandiri + bData.booking_manual; 
                    let pctMandiri = totalBookings > 0 ? Math.round((bData.booking_mandiri / totalBookings) * 100) : 0; 
                    let pctManual = totalBookings > 0 ? 100 - pctMandiri : 0;
                    
                    printHtml += `
                    <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                        <div style="width: 250px;">
                            <h3 style="font-size:13px; text-transform:uppercase;">Rasio Booking</h3>
                            <table style="width:100%; font-size:11px; margin-bottom:10px; border-collapse: collapse;">
                                <tr><td style="border:1px solid #ccc; padding:4px;">Web (Mandiri)</td><td style="border:1px solid #ccc; padding:4px; font-weight:bold; text-align:right;">${bData.booking_mandiri} trx (${pctMandiri}%)</td></tr>
                                <tr><td style="border:1px solid #ccc; padding:4px;">Admin (Manual)</td><td style="border:1px solid #ccc; padding:4px; font-weight:bold; text-align:right;">${bData.booking_manual} trx (${pctManual}%)</td></tr>
                            </table>
                        </div>
                        <div style="width: 350px; border: 3px solid #000; padding: 15px; border-radius: 8px; background:#f9fafb;">
                            <h3 style="font-size:14px; text-align:center; margin-top:0; margin-bottom:15px; text-transform:uppercase;">Kalkulasi Laba</h3>
                            <table style="width:100%; font-size:12px;">
                                <tr><td style="padding-bottom:5px;">Omset Kotor</td><td style="text-align:right; font-weight:bold; color:green; padding-bottom:5px;">${APP.formatRp(bData.gross)}</td></tr>
                                <tr><td style="padding-bottom:5px;">Pengeluaran Manual</td><td style="text-align:right; font-weight:bold; color:red; padding-bottom:5px;">-${APP.formatRp(bData.expense)}</td></tr>
                                <tr><td style="padding-bottom:10px;">Biaya Drop Point (Sistem)</td><td style="text-align:right; font-weight:bold; color:red; padding-bottom:10px;">-${APP.formatRp(dpAmount)}</td></tr>
                                <tr><td colspan="2"><hr style="border-top:2px dashed #000; margin:0 0 10px 0;"></td></tr>
                                <tr style="font-size:16px;"><td style="font-weight:900;">LABA BERSIH</td><td style="text-align:right; font-weight:900;">${APP.formatRp(bData.net)}</td></tr>
                            </table>
                        </div>
                    </div>`;

                    let rowHTML = ''; 
                    bData.order_logs.forEach(l => { 
                        let bLabel = type === 'ALL' ? `(${l.proper_branch}) ` : ''; 
                        let safeDate = l.jam_mulai_sewa ? String(l.jam_mulai_sewa) : (l.createdAt ? String(l.createdAt) : ''); 
                        rowHTML += `<tr><td style="border:1px solid #ccc; padding:4px;">${safeDate.substring(0,10)}</td><td style="border:1px solid #ccc; padding:4px;">${bLabel}U${l.unit_arena}</td><td style="border:1px solid #ccc; padding:4px;">${l.nama_pelanggan_arena}</td><td style="border:1px solid #ccc; padding:4px; text-align:right; font-weight:bold;">${APP.formatRp(l.final_val)}</td></tr>`; 
                    });
                    
                    printHtml += `
                    <h3 style="font-size:13px; margin-bottom:10px; border-bottom:2px solid #000; display:inline-block;">Rincian Log Transaksi</h3>
                    <table style="width:100%; border-collapse: collapse; text-align:left; font-size:10px; margin-bottom:30px;">
                        <tr style="background:#000; color:#fff;"><th style="border:1px solid #000; padding:6px;">Tanggal</th><th style="border:1px solid #000; padding:6px;">Unit</th><th style="border:1px solid #000; padding:6px;">Pelanggan</th><th style="border:1px solid #000; padding:6px; text-align:right;">Tagihan (+Ongkir)</th></tr>
                        ${rowHTML || '<tr><td colspan="4" style="text-align:center; padding:10px;">Tidak ada transaksi di bulan ini.</td></tr>'}
                    </table>
                    <div style="text-align: right; font-size: 11px;">
                        <p>Dicetak Oleh: <b>${STATE.user.username.toUpperCase()}</b></p>
                        <p>Waktu Cetak: ${printDate}</p>
                    </div>`;
                }

                printHtml += `
                    <div style="margin-top: 30px; text-align: center; border-top: 1px solid #e5e7eb; padding-top: 15px; font-family: 'Inter', sans-serif;">
                        <p style="font-size: 8px; color: #9ca3af; letter-spacing: 2px; margin-bottom: 5px; text-transform: uppercase; font-weight: bold;">System By</p>
                        <img src="https://raw.githubusercontent.com/sunsetdansenja-arch/beuna-agency/main/beuna%20logo%20png.png" alt="Beuna Agency" style="height: 14px; opacity: 0.8; filter: grayscale(100%);">
                    </div>
                </div>`;
                
                document.getElementById('print-area').innerHTML = printHtml; 
                document.getElementById('print-area').classList.remove('hidden'); 
                window.print(); 
                document.getElementById('print-area').classList.add('hidden');
            },

            // ==========================================
            // MODALS & EVENT HANDLERS
            // ==========================================
            closeModal: (id) => { document.getElementById(id).classList.add('hidden'); },
            
            openAccModal: (id, pay, branch, dateStr) => { 
                STATE.activeAccId = id; 
                STATE.activeAccPay = pay; 
                document.getElementById('acc-modal-unit').innerHTML = APP.generateUnitOptionsHtml(branch, dateStr); 
                document.getElementById('modal-acc').classList.remove('hidden'); 
            },
            
            confirmAccBooking: async () => { 
                const selectedUnit = document.getElementById('acc-modal-unit').value;
                if(!selectedUnit) { alert("Pilih unit terlebih dahulu bos!"); return; }
                
                APP.closeModal('modal-acc'); 
                APP.showLoader('MENGKONFIRMASI...'); 
                await APP.api({ 
                    action: 'update_status', 
                    row_id: STATE.activeAccId, 
                    status_unit: 'booked', 
                    pembayaran: STATE.activeAccPay, 
                    unit: selectedUnit, 
                    admin_name: STATE.user.username, 
                    keterangan: '' 
                }); 
                await APP.loadDashboard(); 
            },
            
            handleStatusChange: (selectEl, id, pay, unit) => { 
                const newVal = selectEl.value; 
                if (newVal === 'batal') { 
                    selectEl.value = selectEl.getAttribute('data-old-value'); 
                    STATE.activeModalRowId = id; 
                    STATE.activeModalPay = pay; 
                    STATE.activeModalUnit = unit; 
                    document.getElementById('cancel-other').classList.add('hidden'); 
                    document.getElementById('modal-cancel').classList.remove('hidden'); 
                } else { 
                    APP.showLoader('UPDATE STATUS...'); 
                    APP.api({ 
                        action: 'update_status', 
                        row_id: id, 
                        status_unit: newVal, 
                        pembayaran: pay, 
                        unit: unit, 
                        admin_name: STATE.user.username, 
                        keterangan: '' 
                    }).then(() => APP.loadDashboard()); 
                } 
            },
            
            showCancelModal: (id, pay, unit) => { 
                STATE.activeModalRowId = id; 
                STATE.activeModalPay = pay;
                STATE.activeModalUnit = unit || '1';
                document.getElementById('cancel-reason').value = 'Telat Respon';
                document.getElementById('cancel-other').value = '';
                document.getElementById('cancel-other').classList.add('hidden'); 
                document.getElementById('modal-cancel').classList.remove('hidden'); 
            },
            
            toggleCancelOther: () => { 
                document.getElementById('cancel-other').classList.toggle('hidden', document.getElementById('cancel-reason').value !== 'Lainnya'); 
            },
            
            confirmCancel: async () => { 
                let r = document.getElementById('cancel-reason').value; 
                if (r === 'Lainnya') r = document.getElementById('cancel-other').value || 'Alasan tidak disebutkan'; 
                
                APP.closeModal('modal-cancel'); 
                APP.showLoader('MEMBATALKAN...'); 
                await APP.api({ 
                    action: 'update_status', 
                    row_id: STATE.activeModalRowId, 
                    status_unit: 'batal', 
                    pembayaran: STATE.activeModalPay, 
                    unit: STATE.activeModalUnit || '1', 
                    admin_name: STATE.user.username, 
                    keterangan: r 
                }); 
                await APP.loadDashboard(); 
            },
            
            handlePaymentClick: (id, currentStat, currentPay, currentUnit) => { 
                if (currentPay === 'Belum' || !currentPay || currentPay === 'undefined') { 
                    STATE.activeModalRowId = id; 
                    STATE.activeModalStat = currentStat; 
                    STATE.activeModalUnit = currentUnit; 
                    document.getElementById('modal-payment').classList.remove('hidden'); 
                } else { 
                    APP.showLoader('UPDATE BAYAR...'); 
                    APP.api({ 
                        action: 'update_status', 
                        row_id: id, 
                        status_unit: currentStat, 
                        pembayaran: 'Belum', 
                        unit: currentUnit, 
                        admin_name: STATE.user.username, 
                        keterangan: '' 
                    }).then(() => APP.loadDashboard()); 
                } 
            },
            
            confirmPayment: async (method) => { 
                APP.closeModal('modal-payment'); 
                APP.showLoader('UPDATE BAYAR...'); 
                await APP.api({ 
                    action: 'update_status', 
                    row_id: STATE.activeModalRowId, 
                    status_unit: STATE.activeModalStat, 
                    pembayaran: `Lunas ${method}`, 
                    unit: STATE.activeModalUnit, 
                    admin_name: STATE.user.username, 
                    keterangan: '' 
                }); 
                await APP.loadDashboard(); 
            }
        };

        window.onload = APP.init;
    </script>
</body>
</html>
