<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARENA MANAGER - Dashboard</title>
    
    <link rel="icon" href="https://raw.githubusercontent.com/sunsetdansenja-arch/bot-arrena-assets/main/logo%20arena%20gaming.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f2f2f7; color: #1c1c1e; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .apple-card { background: white; border-radius: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03); }
        .menu-btn { transition: all 0.2s ease; }
        .menu-btn:active { transform: scale(0.96); }
        #loader { position: fixed; inset: 0; background: #f2f2f7; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e5e5ea; border-top-color: #007aff; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="loader">
        <div class="spinner mb-4"></div>
        <h2 class="text-lg font-bold text-gray-600 tracking-wide">MENGAMBIL DATA...</h2>
    </div>

    <main class="max-w-2xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-extrabold text-black tracking-tight">Dashboard Manajer</h1>
                <p id="date-text" class="text-sm text-gray-500 font-medium uppercase tracking-wider"></p>
            </div>
            <button onclick="APP.logout()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-full text-xs transition-colors">LOGOUT</button>
        </header>

        <!-- KPI ADMIN SECTION -->
        <section class="apple-card p-6 mb-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-bold">Performa Admin (Bulan Ini)</h2>
                <button onclick="APP.loadDashboard()" class="text-blue-600 text-xs font-bold hover:underline">Refresh</button>
            </div>
            <div id="kpi-list" class="space-y-3">
                <!-- KPI List diisi via JS -->
            </div>
        </section>

        <!-- MENU GRID -->
        <div class="grid grid-cols-2 gap-4">
            <button onclick="window.location.href='logs.html'" class="menu-btn apple-card p-6 flex flex-col items-center border border-gray-100 hover:shadow-xl">
                <span class="text-3xl mb-2">🎮</span>
                <span class="font-bold text-sm">Logs</span>
            </button>
            <button onclick="window.location.href='input.html'" class="menu-btn apple-card p-6 flex flex-col items-center border border-gray-100 hover:shadow-xl">
                <span class="text-3xl mb-2">📝</span>
                <span class="font-bold text-sm">Input</span>
            </button>
            <button onclick="window.location.href='financial.html'" class="menu-btn apple-card p-6 flex flex-col items-center border border-gray-100 hover:shadow-xl col-span-2 bg-blue-600 text-white">
                <span class="text-3xl mb-2">📊</span>
                <span class="font-bold text-sm">Financial Hub</span>
            </button>
        </div>
    </main>

    <script>
        const session = JSON.parse(localStorage.getItem('arena_session_v6'));
        if (!session || session.role !== 'manager') window.location.href = 'index.html';

        const CONFIG = { WEBHOOK_URL: "https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/86cee1b8-b00d-4aa6-8ff4-23735dc9afe1" };
        const STATE = { logs: [] };

        const APP = {
            init: () => {
                document.getElementById('date-text').innerText = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' });
                APP.loadDashboard();
            },
            logout: () => { localStorage.removeItem('arena_session_v6'); window.location.href = 'index.html'; },
            
            api: async (p) => {
                try {
                    const r = await fetch(CONFIG.WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: p.action, data: p }) });
                    const txt = await r.text(); return txt ? JSON.parse(txt) : [];
                } catch (e) { return []; }
            },

            loadDashboard: async () => {
                document.getElementById('loader').classList.remove('hidden');
                const res = await APP.api({ action: 'get_dashboard', role: 'manager', branch: 'ALL' });
                document.getElementById('loader').classList.add('hidden');

                STATE.logs = Array.isArray(res) ? res.map(i => i.json || i) : [];
                APP.renderKPI();
            },

            renderKPI: () => {
                const monthStr = new Date().toISOString().substring(0,7);
                const kpis = {};

                STATE.logs.forEach(l => {
                    const date = l.jam_mulai_sewa || l.createdAt || '';
                    const status = String(l.status_unit_arena).toLowerCase();
                    
                    if (date.startsWith(monthStr) && !['batal', 'pending', 'maintenance'].includes(status)) {
                        const admin = String(l.admin_name || l.Users || 'Unknown').toUpperCase();
                        kpis[admin] = (kpis[admin] || 0) + 1;
                    }
                });

                const kpiContainer = document.getElementById('kpi-list');
                const sortedKpis = Object.entries(kpis).sort((a, b) => b[1] - a[1]);

                if (sortedKpis.length === 0) {
                    kpiContainer.innerHTML = '<p class="text-center text-sm text-gray-400 py-4">Belum ada data transaksi bulan ini.</p>';
                    return;
                }

                kpiContainer.innerHTML = sortedKpis.map(([name, count]) => `
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-xs">
                                ${name.substring(0,2)}
                            </div>
                            <span class="font-bold text-sm">${name}</span>
                        </div>
                        <span class="font-black text-lg text-blue-600">${count} <span class="text-[10px] text-gray-400">trx</span></span>
                    </div>
                `).join('');
            }
        };

        window.onload = APP.init;
    </script>
</body>
</html>
